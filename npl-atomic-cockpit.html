<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NPL Atomic Launch Engine</title>
<meta name="description" content="Atomic P&L decision engine for SIIP new-product launches: concept shortlist, capacity-aware COGM calculator, as-is/to-be reverse EBT, Nielsen market share, and an SKU-by-area launch ranking. Built on the real SIIP COGM workbook and Nielsen snack audit.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
  /* identity: executive navy + warm paper; Fraunces display, Inter body, JetBrains data.
     layout: fixed top identity + subpage rail, one working column of cards per subpage. */
  :root{
    --navy:#122B46; --navy-2:#1C3D5E; --accent:#2F6BD8; --accent-soft:#EAF1FC; --accent-line:#C6DAF6;
    --gold:#B6873B; --gold-soft:#FAF3E6; --gold-line:#ECDBB8;
    --green:#1C8560; --green-soft:#E7F5EF; --green-line:#C2E6D5;
    --amber:#B0781C; --amber-soft:#FbF2E0; --amber-line:#EFDCB2;
    --red:#C13A49; --red-soft:#FBEAEC; --red-line:#F1C6CB;
    --bg:#F5F6F4; --surface:#FFFFFF; --surface-2:#F0F1EE; --paper:#FBFAF7;
    --ink:#1A2230; --ink-2:#44506A; --muted:#6B7488; --border:#E0E2DD; --border-2:#D3D6CF;
    --shadow:0 1px 2px rgba(18,43,70,.05), 0 3px 14px rgba(18,43,70,.07);
    --maxw:1200px; --radius:14px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --navy:#0C1826; --navy-2:#14293E; --accent:#5F92EC; --accent-soft:#15233A; --accent-line:#2B4066;
    --gold:#D6A354; --gold-soft:#2A2113; --gold-line:#574023;
    --green:#3FBB8D; --green-soft:#11271F; --green-line:#235541;
    --amber:#DCA54C; --amber-soft:#2A2012; --amber-line:#574123;
    --red:#E26C79; --red-soft:#2B1418; --red-line:#5A2930;
    --bg:#0A0E15; --surface:#111826; --surface-2:#19212F; --paper:#141B28;
    --ink:#EAEFF8; --ink-2:#C0CADC; --muted:#8992A6; --border:#262F40; --border-2:#313B4F;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 3px 16px rgba(0,0,0,.4);
    color-scheme: dark;
  }}
  :root[data-theme="dark"]{
    --navy:#0C1826; --navy-2:#14293E; --accent:#5F92EC; --accent-soft:#15233A; --accent-line:#2B4066;
    --gold:#D6A354; --gold-soft:#2A2113; --gold-line:#574023;
    --green:#3FBB8D; --green-soft:#11271F; --green-line:#235541;
    --amber:#DCA54C; --amber-soft:#2A2012; --amber-line:#574123;
    --red:#E26C79; --red-soft:#2B1418; --red-line:#5A2930;
    --bg:#0A0E15; --surface:#111826; --surface-2:#19212F; --paper:#141B28;
    --ink:#EAEFF8; --ink-2:#C0CADC; --muted:#8992A6; --border:#262F40; --border-2:#313B4F;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 3px 16px rgba(0,0,0,.4);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:13.5px; line-height:1.55; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{margin:0; color:var(--ink); letter-spacing:-.01em; text-wrap:balance;}
  h1,h2,h3{font-family:"Fraunces","Georgia",serif; font-weight:600;}
  h4{font-family:"Inter",sans-serif; font-weight:700;}
  .mono{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums;}
  p{margin:0;} ul,ol{margin:0;padding:0;list-style:none;} button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:2.5px solid var(--accent); outline-offset:2px; border-radius:4px;}
  @media (prefers-reduced-motion: reduce){ *{transition-duration:.001ms !important;} }
  .shell{max-width:var(--maxw); margin:0 auto; padding-left:22px; padding-right:22px;}
  @media (max-width:640px){ .shell{padding-left:14px; padding-right:14px;} }

  /* top identity */
  .topbar{background:linear-gradient(103deg,var(--navy),var(--navy-2)); color:#fff;}
  .topbar-inner{max-width:var(--maxw); margin:0 auto; padding:16px 22px; display:flex; align-items:center; gap:18px; flex-wrap:wrap;}
  .brand-mark{display:flex; align-items:center; gap:12px;}
  .brand-logo{width:38px;height:38px;border-radius:10px; background:linear-gradient(135deg,var(--gold),#8a6327); display:flex;align-items:center;justify-content:center; font-family:"Fraunces",serif; font-weight:700; font-size:19px; color:#fff; flex:none;}
  .brand-title{font-family:"Fraunces",serif; font-weight:600; font-size:20px; color:#fff; letter-spacing:-.01em; display:block; line-height:1.15;}
  .brand-sub{font-size:11.5px; color:#AFC0DA; display:block; margin-top:1px;}
  .top-right{margin-left:auto; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .top-tag{text-align:right; line-height:1.35;}
  .top-tag .t1{font-size:9.5px; letter-spacing:.16em; color:#8098BC; font-weight:700;}
  .top-tag .t2{font-size:12px; font-weight:700; color:#fff;}
  .ctrls{display:flex; gap:8px;}
  .icon-btn{display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.2); border-radius:999px; padding:6px 12px; font-size:12px; font-weight:600;}
  .icon-btn:hover{background:rgba(255,255,255,.2);}

  /* subpage rail */
  .rail{background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:env(safe-area-inset-top,0px); z-index:30;}
  .rail-inner{max-width:var(--maxw); margin:0 auto; padding:8px 22px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .flow{display:inline-flex; align-items:center; gap:6px; color:var(--muted); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.07em; margin-right:4px;}
  .nav{display:flex; align-items:center; gap:3px; flex-wrap:wrap;}
  .nav button{display:inline-flex; align-items:center; gap:8px; padding:7px 12px; border-radius:10px; color:var(--muted); font-weight:600; font-size:12.5px; background:transparent; border:1px solid transparent;}
  .nav button .sn{width:20px;height:20px;border-radius:6px; background:var(--surface-2); color:var(--muted); display:flex;align-items:center;justify-content:center; font-size:11px; font-weight:800; border:1px solid var(--border); font-family:"JetBrains Mono",monospace;}
  .nav button:hover{color:var(--ink); background:var(--surface-2);}
  .nav button.active{color:var(--navy); background:var(--accent-soft); border-color:var(--accent-line);}
  .nav button.active .sn{background:var(--accent); color:#fff; border-color:var(--accent);}
  :root[data-theme="dark"] .nav button.active, @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .nav button.active{color:var(--ink);} }

  main{padding:18px 0 48px;}
  .pagehead{display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; margin-bottom:14px;}
  .pagehead .ph-main{min-width:0;}
  .pagehead h1{font-size:23px; font-weight:600;}
  .pagehead .lead{font-size:12.5px; color:var(--muted); margin-top:3px; max-width:76ch;}
  .pagehead .step-chip{margin-left:auto; font-size:10.5px; font-weight:700; color:var(--gold); background:var(--gold-soft); border:1px solid var(--gold-line); border-radius:999px; padding:5px 12px; text-transform:uppercase; letter-spacing:.06em; white-space:nowrap;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:16px; overflow:hidden;}
  .card-head{display:flex; align-items:center; gap:11px; padding:14px 16px; border-bottom:1px solid var(--border);}
  .card-head .ico{width:30px;height:30px;border-radius:9px; background:var(--accent-soft); color:var(--accent); display:flex;align-items:center;justify-content:center; font-size:15px; flex:none;}
  .card-head h3{font-size:14.5px; font-weight:700; font-family:"Inter",sans-serif;}
  .card-head .hsub{font-size:11px; color:var(--muted); margin-top:1px;}
  .card-head .right{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .card-body{padding:16px;}

  .concept-note{display:flex; gap:11px; padding:12px 14px; background:var(--paper); border-bottom:1px solid var(--border); font-size:12px; color:var(--ink-2); line-height:1.6;}
  .concept-note .qi{color:var(--gold); font-size:15px; flex:none;}
  .concept-note b{color:var(--ink);}
  .quote{border-left:2.5px solid var(--gold); padding:1px 0 1px 10px; margin:5px 0 0; color:var(--ink-2); font-style:italic;}

  /* selectors */
  .selbar{display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end;}
  .fld{display:flex; flex-direction:column; gap:4px; min-width:140px;}
  .fld label{font-size:10.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.05em;}
  select, input[type=number]{font-family:inherit; font-size:13px; padding:8px 10px; border:1px solid var(--border-2); border-radius:9px; background:var(--surface); color:var(--ink); min-width:0;}
  input[type=number]{font-family:"JetBrains Mono",monospace; text-align:right; width:120px;}
  input[type=range]{accent-color:var(--accent); width:100%;}
  .seg{display:inline-flex; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:3px; gap:2px; flex-wrap:wrap;}
  .seg button{border:none; background:transparent; color:var(--ink-2); font-weight:700; font-size:12px; padding:6px 13px; border-radius:7px;}
  .seg button.on{background:var(--accent); color:#fff;}
  .slider-head{display:flex; justify-content:space-between; font-size:11px; color:var(--muted); font-weight:700; margin-bottom:4px;}
  .slider-head b{color:var(--ink); font-family:"JetBrains Mono",monospace;}

  /* tiles */
  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(138px,1fr)); gap:11px;}
  .tile{background:var(--paper); border:1px solid var(--border); border-radius:11px; padding:12px 13px;}
  .tile .tl{font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700;}
  .tile .tv{font-weight:700; font-size:19px; font-family:"JetBrains Mono",monospace; margin-top:5px; letter-spacing:-.01em;}
  .tile .tsub{font-size:10.5px; color:var(--muted); margin-top:3px;}
  .tile.hi{background:var(--accent-soft); border-color:var(--accent-line);}
  .tile.good{background:var(--green-soft); border-color:var(--green-line);}
  .tile.bad{background:var(--red-soft); border-color:var(--red-line);}
  .tile.warn{background:var(--amber-soft); border-color:var(--amber-line);}

  /* npl concept cards */
  .npl-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:13px;}
  .npl{border:1px solid var(--border); border-radius:13px; background:var(--surface); padding:14px; cursor:pointer; display:flex; flex-direction:column; gap:9px; min-width:0; position:relative; transition:border-color .15s;}
  .npl:hover{border-color:var(--accent-line);}
  .npl.sel{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  .npl.empty{border-style:dashed; background:var(--paper); cursor:default; align-items:center; justify-content:center; text-align:center; color:var(--muted); min-height:120px;}
  .npl .nh{display:flex; align-items:center; gap:10px;}
  .npl .emoji{width:40px;height:40px;border-radius:10px; background:var(--gold-soft); display:flex;align-items:center;justify-content:center; font-size:21px; flex:none;}
  .npl .nm{font-weight:700; font-size:14.5px; line-height:1.2;}
  .npl .sku{font-size:10.5px; color:var(--muted); font-family:"JetBrains Mono",monospace;}
  .npl .statrow{display:flex; gap:0; border:1px solid var(--border); border-radius:9px; overflow:hidden;}
  .npl .statrow>div{flex:1; padding:7px 9px; text-align:center;}
  .npl .statrow>div+div{border-left:1px solid var(--border);}
  .npl .statrow .sv{font-weight:700; font-size:14px; font-family:"JetBrains Mono",monospace;}
  .npl .statrow .sl{font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-top:1px;}
  .chips{display:flex; flex-wrap:wrap; gap:5px;}
  .chip{font-size:10px; font-weight:700; padding:2px 8px; border-radius:999px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink-2); white-space:nowrap;}
  .chip.good{background:var(--green-soft); border-color:var(--green-line); color:var(--green);}
  .chip.warn{background:var(--amber-soft); border-color:var(--amber-line); color:var(--amber);}
  .chip.bad{background:var(--red-soft); border-color:var(--red-line); color:var(--red);}
  .chip.gold{background:var(--gold-soft); border-color:var(--gold-line); color:var(--gold);}
  .npl .why{font-size:11.5px; color:var(--ink-2); line-height:1.5;}

  /* tables */
  .table-wrap{overflow-x:auto;}
  table.dt{width:100%; border-collapse:collapse; font-size:12.5px; min-width:540px;}
  table.dt caption{text-align:left; font-size:11px; color:var(--muted); padding:0 0 9px; caption-side:top;}
  table.dt th, table.dt td{padding:9px 11px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap;}
  table.dt th{font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; background:var(--paper);}
  table.dt td.num, table.dt th.num{text-align:right; font-family:"JetBrains Mono",monospace;}
  table.dt tbody tr:hover{background:var(--accent-soft);}
  table.dt tbody tr.sel{background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent);}
  table.dt tr.grp td{font-weight:700; background:var(--surface-2);}
  table.dt tr.hl td{background:var(--gold-soft);}
  .delta-up{color:var(--green); font-weight:700;} .delta-dn{color:var(--red); font-weight:700;}
  .badge{display:inline-block; font-size:10px; font-weight:800; padding:2px 10px; border-radius:999px; border:1px solid; letter-spacing:.02em;}
  .b-go{background:var(--green-soft); border-color:var(--green-line); color:var(--green);}
  .b-pilot{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent);}
  .b-rework{background:var(--amber-soft); border-color:var(--amber-line); color:var(--amber);}
  .b-hold{background:var(--red-soft); border-color:var(--red-line); color:var(--red);}

  /* as-is / to-be */
  .aistobe{width:100%; border-collapse:collapse; font-size:12.5px;}
  .aistobe th,.aistobe td{padding:8px 11px; border-bottom:1px solid var(--border); white-space:nowrap;}
  .aistobe th{font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; text-align:right;}
  .aistobe th:first-child{text-align:left;}
  .aistobe td.lab{text-align:left; color:var(--ink-2);}
  .aistobe td.num{text-align:right; font-family:"JetBrains Mono",monospace;}
  .aistobe .col-tobe{background:var(--accent-soft);}
  .aistobe tr.move td{font-weight:700;}
  .aistobe tr.move .col-tobe{color:var(--accent);}
  .aistobe tr.ebt td{font-weight:800; background:var(--gold-soft);}
  .aistobe tr.gp td{font-weight:700;}

  .capmeter{height:28px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border); position:relative; overflow:hidden;}
  .capmeter .fill{position:absolute; top:0; bottom:0; left:0;}
  .capmeter .mk{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); opacity:.5;}
  .capmeter .mk span{position:absolute; top:-15px; left:50%; transform:translateX(-50%); font-size:9px; color:var(--muted); white-space:nowrap; font-weight:700;}

  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--muted); margin-top:9px;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .legend i{width:11px;height:11px;border-radius:3px; display:inline-block;}
  .bars{display:flex; flex-direction:column; gap:7px; margin-top:4px;}
  .barrow{display:flex; align-items:center; gap:10px; font-size:12px;}
  .barrow .bl{width:150px; color:var(--ink-2); flex:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .barrow .bt{flex:1; background:var(--surface-2); border-radius:6px; height:20px; overflow:hidden; min-width:60px;}
  .barrow .bt i{display:block; height:100%; border-radius:6px;}
  .barrow .bv{width:70px; text-align:right; font-family:"JetBrains Mono",monospace; flex:none;}

  .reasons{display:flex; flex-direction:column; gap:7px; margin-top:4px;}
  .ri{display:flex; gap:8px; font-size:12px; color:var(--ink-2); align-items:flex-start;}
  .ri .ok{color:var(--green); font-weight:800;} .ri .no{color:var(--red); font-weight:800;} .ri .wn{color:var(--amber); font-weight:800;}
  .note{font-size:11px; color:var(--muted); line-height:1.6; margin-top:12px;}
  .srcbar{display:flex; gap:9px; align-items:flex-start; font-size:11px; color:var(--muted); background:var(--paper); border:1px dashed var(--border-2); border-radius:9px; padding:10px 12px; margin-top:14px; line-height:1.6;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:820px){ .grid2{grid-template-columns:1fr;} }
  .txt-green{color:var(--green);} .txt-amber{color:var(--amber);} .txt-red{color:var(--red);} .txt-muted{color:var(--muted);} .txt-accent{color:var(--accent);}
  .foot{max-width:var(--maxw); margin:10px auto 0; padding:14px 22px 34px; color:var(--muted); font-size:11px; line-height:1.6;}
  svg{display:block; max-width:100%;}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand-mark">
      <div class="brand-logo">S</div>
      <div>
        <span class="brand-title">NPL Atomic Launch Engine</span>
        <span class="brand-sub" data-i18n="brandSub">SIIP · Pull the P&amp;L forward — from concept to the best launch area</span>
      </div>
    </div>
    <div class="top-right">
      <div class="top-tag"><div class="t1">ATOMIC P&amp;L</div><div class="t2" data-i18n="tagCeo">CEO decision view</div></div>
      <div class="ctrls">
        <button type="button" class="icon-btn" id="langBtn">🌐 <span id="langLabel">EN</span></button>
        <button type="button" class="icon-btn" id="themeBtn">◐ <span id="themeLabel">System</span></button>
      </div>
    </div>
  </div>
</header>

<nav class="rail">
  <div class="rail-inner">
    <span class="flow" data-i18n="flow">Flow</span>
    <div class="nav" id="nav"></div>
  </div>
</nav>

<main>
  <div class="shell">
    <div id="view"></div>
  </div>
</main>

<footer class="foot">
  <span data-i18n="footBrand">Atomic P&amp;L — "What kills an NPL is EBT, not GP1." Small but compounding: the first atom cell never loses money.</span>
</footer>

<script>
(function(){
  "use strict";
  function loadJSON(k,f){ try{ var r=localStorage.getItem(k); if(r) return JSON.parse(r);}catch(e){} return f; }
  function saveJSON(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  var lang = loadJSON('npla-lang','en');

  /* ===================== COGM ENGINE (real SIIP workbook) ===================== */
  // Machine Sip 3.5g 500. Full capacity 95,256 ctn/mo/line. DBP (base price) = Rp94,734.97/ctn.
  // Depreciation & OMC are fixed monthly -> per-carton cost balloons when volume < capacity.
  // DL, Listrik, Gas, RM, PM are per-carton constants (do not change with utilisation).
  var ENG = {
    fullCap:95256, dbp:94734.973,
    depreMo:1394.1082*95256, omcMo:2492.1861*95256,   // Rp132.80M + Rp237.40M
    dl:6067.2232, listrik:732.42, gas:413.20, pm:35172.00
  };
  ENG.fixedMo = ENG.depreMo + ENG.omcMo;
  function cogmComponents(vol, rm){
    return { depre:ENG.depreMo/vol, omc:ENG.omcMo/vol, dl:ENG.dl, listrik:ENG.listrik, gas:ENG.gas, rm:rm, pm:ENG.pm };
  }
  function cogmAt(vol, rm){ var c=cogmComponents(vol,rm); return c.depre+c.omc+c.dl+c.listrik+c.gas+c.rm+c.pm; }
  function gpPctAt(vol, rm){ return (1 - cogmAt(vol,rm)/ENG.dbp)*100; }

  /* ===================== DATA ===================== */
  // 3 active SIIP NPL (real COGM from the workbook) + 7 open slots (Stage-1 fill).
  var NPLS = [
    {k:'nori', name:'SIIP Nori', sku:'304xxx · 3.5g', emoji:'🍙', rm:28661.4524, cogmFull:74932.453, gpFull:20.9,
      nielsen:'seaweed', dbpSell:71000,
      seasoning:{keju:1.3922, coklat:0.71, jagung:1.3148},

  function cogmTilesHtml(c,vol){

  function cogmTableHtml(c,vol){
    var comp=cogmComponents(vol,c.rm), cogm=cogmAt(vol,c.rm);
    var rows=[['lDepre',comp.depre,true],['lOmc',comp.omc,true],['lDl',comp.dl,false],['lListrik',comp.listrik,false],['lGas',comp.gas,false],['lRm',comp.rm,false],['lPm',comp.pm,false]];
    var body=rows.map(function(r){ var v=r[1]; return '<tr><td class="lab">'+t(r[0])+(r[2]?' <span class="chip warn" style="font-size:9px">'+(lang==='id'?'tetap/bln':'fixed/mo')+'</span>':'')+'</td><td class="num">'+rpFull(v)+'</td><td class="num txt-muted">'+pct(v/cogm*100)+'</td></tr>'; }).join('');
    return '<div class="table-wrap"><table class="dt" style="min-width:420px"><thead><tr><th>'+t('line')+'</th><th class="num">'+t('perCtn')+'</th><th class="num">'+t('shareCogm')+'</th></tr></thead><tbody>'+body+
      '<tr class="grp"><td>'+t('lTotal')+'</td><td class="num">'+rpFull(cogm)+'</td><td class="num">'+pct(100)+'</td></tr></tbody></table></div>';
  }
  function cogmCurve(c){
    var W=680,H=240,pL=58,pR=16,pT=14,pB=34, vmin=20000,vmax=100000, cmin=68000,cmax=86000;
    function X(v){ return pL+(v-vmin)/(vmax-vmin)*(W-pL-pR); }
    function Y(cg){ return pT+(cmax-cg)/(cmax-cmin)*(H-pT-pB); }
    var pts=[]; for(var v=vmin;v<=vmax;v+=2000) pts.push(X(v)+','+Y(Math.min(cmax,cogmAt(v,c.rm))));
    var xt=[20000,40000,60000,80000,100000].map(function(v){ return '<line x1="'+X(v)+'" y1="'+pT+'" x2="'+X(v)+'" y2="'+(H-pB)+'" stroke="var(--border)"/>'+'<text x="'+X(v)+'" y="'+(H-pB+16)+'" font-size="10" fill="var(--muted)" text-anchor="middle" font-family="JetBrains Mono">'+(v/1000)+'k</text>'; }).join('');
    var yt=[70000,74000,78000,82000,86000].map(function(cg){ return '<line x1="'+pL+'" y1="'+Y(cg)+'" x2="'+(W-pR)+'" y2="'+Y(cg)+'" stroke="var(--border)" opacity=".6"/>'+'<text x="'+(pL-8)+'" y="'+(Y(cg)+3)+'" font-size="10" fill="var(--muted)" text-anchor="end" font-family="JetBrains Mono">'+(cg/1000)+'k</text>'; }).join('');
    function dot(v,col,lab){ var cg=cogmAt(v,c.rm); if(cg>cmax)cg=cmax; return '<circle cx="'+X(v)+'" cy="'+Y(cg)+'" r="4.5" fill="'+col+'"/><text x="'+X(v)+'" y="'+(Y(cg)-9)+'" font-size="10" fill="'+col+'" text-anchor="middle" font-weight="700" font-family="JetBrains Mono">'+lab+'</text>'; }
    var cur=st.vol>=vmin&&st.vol<=vmax?'<circle cx="'+X(st.vol)+'" cy="'+Y(Math.min(cmax,cogmAt(st.vol,c.rm)))+'" r="6" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>':'';
    return '<div class="table-wrap"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="COGM vs volume">'+yt+xt+
      '<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2.5"/>'+
      dot(95256,'var(--green)',rpShort(cogmAt(95256,c.rm)))+dot(30000,'var(--red)',rpShort(cogmAt(30000,c.rm)))+cur+'</svg></div>'+
      '<div class="legend"><span><i style="background:var(--accent)"></i>'+c.name+' COGM</span><span><i style="background:var(--green)"></i>'+t('atFull')+'</span><span><i style="background:var(--red)"></i>30,000 '+t('ctn')+' (1/3)</span></div>';
  }

  /* ===================== PAGE 3 — Reverse EBT ===================== */
  function reverse(base, rc, target){
    var O=baseFixedBelowGp1(base), denom=1-rc-target;
    if(denom<=0) return {feasible:false, O:O};
    var ns=O/denom;
    return {feasible:true, O:O, ns:ns, cogm:rc*ns, ebt:target*ns, gp1:ns-rc*ns};
  }
  function page3(){
    var c=npl(st.sel), b=BASE[st.base], rc=c.cogmFull/ENG.dbp;
    var asisEbt=baseEbt(b), r=reverse(b,rc,st.target);
    var baseSel='<select id="baseSel">'+Object.keys(BASE).map(function(k){ var x=BASE[k]; return '<option value="'+k+'"'+(k===st.base?' selected':'')+'>'+x.flag+' '+L(x.name)+(x.real?'':' *')+'</option>'; }).join('')+'</select>';
    var tgtSeg='<div class="seg" id="tgtSeg"><button data-tv="0" class="'+(st.target===0?'on':'')+'">'+t('breakEven')+'</button>'+
      [0.05,0.085,0.10].map(function(x){ return '<button data-tv="'+x+'" class="'+(st.target===x?'on':'')+'">'+pct(x*100,x===0.085?1:0)+'</button>'; }).join('')+'</div>';
    var rows='';
    function r2(lab,asisV,asisR,tobeV,tobeR,cls){
      return '<tr class="'+(cls||'')+'"><td class="lab">'+lab+'</td>'+
        '<td class="num">'+rpShort(asisV)+'</td><td class="num txt-muted">'+(asisR==null?'—':pct(asisR))+'</td>'+
        '<td class="num col-tobe">'+(tobeV==null?'—':rpShort(tobeV))+'</td><td class="num col-tobe txt-muted">'+(tobeR==null?'—':pct(tobeR))+'</td></tr>';
    }
    if(r.feasible){
      rows=r2(t('iNsar'),b.nsar,100,r.ns,100,'move')+
        r2(t('iCogm'),b.cogs,b.cogs/b.nsar*100,r.cogm,rc*100,'move')+
        r2(t('iGp1'),b.nsar-b.cogs,(b.nsar-b.cogs)/b.nsar*100,r.gp1,r.gp1/r.ns*100,'gp')+
        r2(t('iSm1'),b.sm1,b.sm1/b.nsar*100,b.sm1,b.sm1/r.ns*100)+
        r2(t('iSm2'),b.sm2,b.sm2/b.nsar*100,b.sm2,b.sm2/r.ns*100)+
        r2(t('iSm3'),b.sm3,b.sm3/b.nsar*100,b.sm3,b.sm3/r.ns*100)+
        r2(t('iSm4'),b.sm4,b.sm4/b.nsar*100,b.sm4,b.sm4/r.ns*100)+
        r2(t('iEbt'),asisEbt,asisEbt/b.nsar*100,r.ebt,st.target*100,'ebt');
    }
    var gap = r.feasible ? (r.ns/b.nsar-1)*100 : null;
    var feasCls = !r.feasible?'bad':gap<=25?'good':gap<=80?'warn':'bad';
    var feasTxt = !r.feasible?t('feasNo'):gap<=25?t('feasEasy'):gap<=80?t('feasHard'):t('feasHard');
    var tiles = r.feasible ? '<div class="tiles" style="margin-top:14px">'+
        tile(t('salesGap'),pctS(gap),feasCls,rpShort(r.ns-b.nsar))+
        tile(t('ebtTobe'),rpShort(r.ebt),'hi',t('targetEbt')+' '+pct(st.target*100,st.target===0.085?1:0))+
        tile(t('cogmRatio'),pct(rc*100),rc<=0.75?'good':rc>=0.82?'bad':'warn',c.name)+
        tile(t('feasHdr'),feasCls==='good'?'✓':feasCls==='warn'?'~':'✕',feasCls,feasTxt)+'</div>' : '';
    var reading = r.feasible ? '<p class="note">'+t('p3read',{name:c.name, ns:rpShort(r.ns), base:rpShort(b.nsar), t:pct(st.target*100,st.target===0.085?1:0), g:pctS(gap), rc:pct(rc*100)})+'</p>' : '<p class="note txt-red">'+t('feasNo')+'</p>';
    var body='<div class="card-body">'+
      '<div class="selbar"><div class="fld"><label>'+t('baseline')+'</label>'+baseSel+'</div>'+
        '<div class="fld"><label>'+t('injectNpl')+'</label>'+nplPicker()+'</div>'+
        '<div class="fld"><label>'+t('targetEbt')+'</label>'+tgtSeg+'</div></div>'+
      tiles+
      '<div class="table-wrap" style="margin-top:16px"><table class="aistobe"><thead><tr><th>'+t('item')+'</th><th>'+t('asis')+'</th><th>'+t('ratio')+'</th><th class="col-tobe">'+t('tobe')+'</th><th class="col-tobe">'+t('ratio')+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      reading+
      '<p class="note">'+t('moveNote')+'</p>'+
      srcbar(true)+'</div>';
    return pagehead(t('p3t'),t('p3l'))+card('🧮',t('nav3'),L(b.name)+' · '+c.name,t('p3note'),body);
  }

  /* ===================== PAGE 5 — Launch Ranking ===================== */
  function rankScore(c, channel){
    // COGM margin (40): GP% full-cap normalised 14..26 -> 0..40
    var gpS=Math.max(0,Math.min(40,(c.gpFull-13)/13*40));
    // Nielsen demand (35): growth + size of mapped flavour
    var fl=flavor(c.nielsen), dem;
    if(!fl) dem=14; // white space
    else dem=Math.max(0,Math.min(35, 17 + fl.chg*0.7 + Math.min(10,fl.val/120000)));
    // channel fit (25): GT where SIIP strong; MT a bit lower
    var ch=channel==='GT'?25:18;
    return Math.round(gpS+dem+ch);
  }
  function callOf(score){ return score>=72?'launch':score>=58?'pilot':score>=44?'rework':'hold'; }
  function page5(){
    var rows=RANK_SEED.map(function(s){ var c=npl(s.npl), fl=flavor(c.nielsen);
      var score=rankScore(c,s.channel), call=callOf(score);
      if(!fl && call==='launch') call='pilot'; // white space demand unproven -> validate before full launch
      return {s:s,c:c,fl:fl,score:score,call:call};
    }).sort(function(a,b){ return b.score-a.score; });
    var callMap={launch:'b-go',pilot:'b-pilot',rework:'b-rework',hold:'b-hold'};
    var trs=rows.map(function(r,i){ var c=r.c, fl=r.fl;
      var dem = fl? (fl.chg>=10?'<span class="delta-up">▲ '+pctS(fl.chg)+'</span>':fl.chg<0?'<span class="delta-dn">▼ '+pctS(fl.chg)+'</span>':pctS(fl.chg)) : '<span class="txt-muted">white space</span>';
      return '<tr class="'+(c.k===st.sel?'sel':'')+'" data-k="'+c.k+'"><td class="num">'+(i+1)+'</td>'+
        '<td>'+c.emoji+' '+c.name+'</td>'+
        '<td>'+r.s.country+' · '+r.s.channel+' · '+r.s.sub+'</td>'+
        '<td class="num '+(c.gpFull>=22?'txt-green':c.gpFull<16?'txt-red':'txt-amber')+'">'+pct(c.gpFull)+'</td>'+
        '<td>'+dem+'</td>'+
        '<td class="num"><b>'+r.score+'</b></td>'+
        '<td class="num">'+(r.s.field?r.s.field:'<span class="txt-muted">—</span>')+'</td>'+
        '<td><span class="badge '+callMap[r.call]+'">'+t('call'+r.call.charAt(0).toUpperCase()+r.call.slice(1))+'</span></td></tr>'; }).join('');
    var rankTable='<div class="table-wrap"><table class="dt" id="rankT"><thead><tr><th class="num">'+t('rkHdr')+'</th><th>'+t('skuHdr')+'</th><th>'+t('areaHdr')+'</th><th class="num">'+t('gpHdr')+'</th><th>'+t('demandHdr')+'</th><th class="num">'+t('scoreHdr')+'</th><th class="num">'+t('fieldHdr')+'</th><th>'+t('callHdr')+'</th></tr></thead><tbody>'+trs+'</tbody></table></div>';
    // bundle recommendation banner
    var bundle='<div class="tile hi" style="display:flex;gap:14px;align-items:center;padding:14px 16px"><div style="font-size:30px">🏆</div><div><div class="tl">'+t('bundleRec')+'</div><div style="font-weight:700;font-size:15px;margin:3px 0;font-family:Fraunces,serif">'+BUNDLE.label+' · '+BUNDLE.country+' '+BUNDLE.channel+'</div><div style="font-size:12px;color:var(--ink-2)">'+t('bundleWhy',{s:BUNDLE.field})+'</div></div></div>';
    // slice n dice table
    var sliceRows=AREAS.map(function(a){ return '<tr><td>'+a.flag+' '+L(a.c)+'</td><td style="white-space:normal">'+L(a.gt)+'</td><td style="white-space:normal">'+L(a.mt)+'</td><td style="white-space:normal">'+L(a.uniq)+'</td></tr>'; }).join('');
    var sliceTable='<div class="table-wrap"><table class="dt" style="min-width:640px"><thead><tr><th>'+t('cCountry')+'</th><th>'+t('cGt')+'</th><th>'+t('cMt')+'</th><th>'+t('cUniq')+'</th></tr></thead><tbody>'+sliceRows+'</tbody></table></div>';
    var map=channelMap();
    var body1='<div class="card-body">'+bundle+'<div style="margin-top:14px">'+rankTable+'</div><p class="note">'+t('scoreForm')+'</p>'+srcbar()+'</div>';
    var body2='<div class="card-body"><div class="grid2"><div><h4 style="font-size:12.5px;margin-bottom:10px">'+t('mapT')+'</h4>'+map+'</div><div>'+sliceTable+'</div></div></div>';
    return pagehead(t('p5t'),t('p5l'))+
      card('🏁',t('nav5'),null,t('p5note'),body1)+
      card('🗺️',t('sliceT'),null,null,body2);
  }
  function channelMap(){
    // simple proportional treemap of SIIP channel value (GT Large/Small, MT sub)
    var segs=[{n:'GT Large',v:324803,c:'var(--accent)'},{n:'GT Small',v:82445,c:'var(--navy-2)'},
      {n:'MT Minimarket',v:61100,c:'var(--gold)'},{n:'MT Independent',v:59664,c:'var(--green)'},
      {n:'MT Key Acc',v:26365,c:'var(--amber)'},{n:'MT Hyper',v:24929,c:'var(--red)'}];
    var tot=segs.reduce(function(a,b){return a+b.v;},0), W=440,H=150,x=0;
    var rects=segs.map(function(s){ var w=s.v/tot*W; var r='<g><rect x="'+x+'" y="0" width="'+(w-2)+'" height="'+H+'" rx="6" fill="'+s.c+'" opacity=".88"/>'+
      (w>52?'<text x="'+(x+8)+'" y="24" font-size="11" fill="#fff" font-weight="700">'+s.n+'</text><text x="'+(x+8)+'" y="42" font-size="10" fill="#fff" font-family="JetBrains Mono" opacity=".9">Rp'+Math.round(s.v/1000)+'B</text>':'')+'</g>'; x+=w; return r; }).join('');
    return '<div class="table-wrap"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="SIIP channel map">'+rects+'</svg></div>'+
      '<p class="note">'+(lang==='id'?'GT = 83% nilai SIIP (kekuatan). Minimarket kecil tapi kategori tumbuh +9,5% — headroom launch.':'GT = 83% of SIIP value (the strength). Minimarket is small but the category grows +9.5% — launch headroom.')+'</p>';
  }

  /* ===================== shared ===================== */
  function srcbar(reverse){
    var txt = reverse ?
      (lang==='id'
        ? 'Baseline Indonesia = P&L existing (angka nyata). Malaysia & China (*) = asumsi perencanaan 2025. Rasio COGM to-be dari kalkulator COGM (kapasitas penuh). Hanya Net Sales/COGM/EBT bergerak nominal; SM1–SM4 ditahan nominal.'
        : 'Indonesia baseline = existing P&L (real figures). Malaysia & China (*) = 2025 planning assumptions. To-be COGM ratio comes from the COGM calculator (full capacity). Only Net Sales/COGM/EBT move in rupiah; SM1–SM4 are held in rupiah.')
      : (lang==='id'
        ? 'COGM dari workbook SIIP asli (Depre 1.394 + OMC 2.492 + DL 6.067 + Listrik 732 + Gas 413 + RM per rasa + PM 35.172, DBP 94.735). Depre & OMC tetap/bulan → membengkak saat utilisasi turun. Market share dari audit Nielsen snack. Seed ranking dari workbook.'
        : 'COGM from the real SIIP workbook (Depre 1,394 + OMC 2,492 + DL 6,067 + Listrik 732 + Gas 413 + RM per flavour + PM 35,172, DBP 94,735). Depre & OMC fixed/month → balloon as utilisation falls. Market share from the Nielsen snack audit. Ranking seed from the workbook.');
    return '<div class="srcbar"><span>📎</span><span>'+txt+'</span></div>';
  }

  /* ===================== render + wire ===================== */
  function render(){
    document.querySelectorAll('[data-i18n]').forEach(function(el){ el.innerHTML=t(el.getAttribute('data-i18n')); });
    document.documentElement.setAttribute('lang',lang);
    renderNav();
    document.getElementById('view').innerHTML=[page1,page2,page3,page4,page5][st.page-1]();
    wire();
  }
  function wire(){
    document.querySelectorAll('.npl[data-k]').forEach(function(el){ if(el.classList.contains('empty'))return; el.addEventListener('click',function(){ st.sel=el.getAttribute('data-k'); if(st.page===2)st.vol=ENG.fullCap; render(); }); });
    var sel=document.getElementById('nplSel'); if(sel) sel.addEventListener('change',function(){ st.sel=sel.value; if(st.page===2)st.vol=ENG.fullCap; render(); });
    var vr=document.getElementById('volR'); if(vr) vr.addEventListener('input',function(){ st.vol=+vr.value; var c=npl(st.sel);
      var a=document.getElementById('volLbl'); if(a)a.textContent=grp(st.vol)+' '+t('ctn');
      var m=document.getElementById('capM'); if(m)m.innerHTML=capFill(st.vol);
      var ti=document.getElementById('cogmTiles'); if(ti)ti.innerHTML=cogmTilesHtml(c,st.vol);
      var tb=document.getElementById('cogmTable'); if(tb)tb.innerHTML=cogmTableHtml(c,st.vol);
      var cv=document.getElementById('cogmCurve'); if(cv)cv.innerHTML=cogmCurve(c);
    });
    var bs=document.getElementById('baseSel'); if(bs) bs.addEventListener('change',function(){ st.base=bs.value; render(); });
    var tg=document.getElementById('tgtSeg'); if(tg) tg.querySelectorAll('button').forEach(function(b){ b.addEventListener('click',function(){ st.target=parseFloat(b.getAttribute('data-tv')); render(); }); });
    var rt=document.getElementById('rankT'); if(rt) rt.querySelectorAll('tbody tr').forEach(function(tr){ tr.addEventListener('click',function(){ st.sel=tr.getAttribute('data-k'); render(); }); });
  }

  /* ===================== theme + lang ===================== */
  function applyTheme(mode){ var r=document.documentElement;
    if(mode==='light')r.setAttribute('data-theme','light'); else if(mode==='dark')r.setAttribute('data-theme','dark'); else r.removeAttribute('data-theme');
    var lbl=document.getElementById('themeLabel'); if(lbl)lbl.textContent=mode==='light'?(lang==='id'?'Terang':'Light'):mode==='dark'?(lang==='id'?'Gelap':'Dark'):(lang==='id'?'Sistem':'System');
    try{localStorage.setItem('npla-theme',mode);}catch(e){} }
  (function(){ var s='system'; try{s=localStorage.getItem('npla-theme')||'system';}catch(e){} applyTheme(s);
    document.getElementById('themeBtn').addEventListener('click',function(){ var c='system'; try{c=localStorage.getItem('npla-theme')||'system';}catch(e){} applyTheme(c==='system'?'light':c==='light'?'dark':'system'); }); })();
  document.getElementById('langBtn').addEventListener('click',function(){ lang=lang==='en'?'id':'en'; saveJSON('npla-lang',lang);
    document.getElementById('langLabel').textContent=lang==='id'?'ID':'EN'; var s='system'; try{s=localStorage.getItem('npla-theme')||'system';}catch(e){} applyTheme(s); render(); });
  document.getElementById('langLabel').textContent=lang==='id'?'ID':'EN';

  render();
})();
</script>
</body>
</html>
