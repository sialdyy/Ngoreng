<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NPL Launch Decision Engine</title>
<meta name="description" content="End-to-end NPL launch decision engine for SIIP: concept register, per-SKU COGM, as-is/to-be reverse EBT, category market share, and a scored SKU-by-country launch ranking with full Opportunity, Probability, Risk and Confidence breakdowns. Data is uploadable and persists in the browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.34.4/dist/globe.gl.min.js"></script>
<style>
  /* executive navy + warm paper. Fraunces headings, Inter body (formal, readable), JetBrains data. minimal motion. */
  :root{
    --navy:#122B46; --navy-2:#1C3D5E; --accent:#2F6BD8; --accent-soft:#EAF1FC; --accent-line:#C6DAF6;
    --gold:#B6873B; --gold-soft:#FAF3E6; --gold-line:#ECDBB8;
    --green:#1C8560; --green-soft:#E7F5EF; --green-line:#C2E6D5;
    --amber:#B0781C; --amber-soft:#FBF2E0; --amber-line:#EFDCB2;
    --red:#C13A49; --red-soft:#FBEAEC; --red-line:#F1C6CB;
    --bg:#F4F5F3; --surface:#FFFFFF; --surface-2:#EFF0ED; --paper:#FBFAF7;
    --ink:#182030; --ink-2:#434F67; --muted:#697183; --border:#E1E3DE; --border-2:#D2D5CE;
    --shadow:0 1px 2px rgba(18,43,70,.05), 0 2px 10px rgba(18,43,70,.06);
    --maxw:1220px; --radius:12px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --navy:#0C1826; --navy-2:#14293E; --accent:#5F92EC; --accent-soft:#15233A; --accent-line:#2B4066;
    --gold:#D6A354; --gold-soft:#2A2113; --gold-line:#574023;
    --green:#3FBB8D; --green-soft:#11271F; --green-line:#235541;
    --amber:#DCA54C; --amber-soft:#2A2012; --amber-line:#574123;
    --red:#E26C79; --red-soft:#2B1418; --red-line:#5A2930;
    --bg:#0A0E15; --surface:#111826; --surface-2:#19212F; --paper:#141B28;
    --ink:#EAEFF8; --ink-2:#C0CADC; --muted:#8992A6; --border:#262F40; --border-2:#313B4F;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 2px 12px rgba(0,0,0,.35);
    color-scheme: dark;
  }}
  :root[data-theme="dark"]{
    --navy:#0C1826; --navy-2:#14293E; --accent:#5F92EC; --accent-soft:#15233A; --accent-line:#2B4066;
    --gold:#D6A354; --gold-soft:#2A2113; --gold-line:#574023;
    --green:#3FBB8D; --green-soft:#11271F; --green-line:#235541;
    --amber:#DCA54C; --amber-soft:#2A2012; --amber-line:#574123;
    --red:#E26C79; --red-soft:#2B1418; --red-line:#5A2930;
    --bg:#0A0E15; --surface:#111826; --surface-2:#19212F; --paper:#141B28;
    --ink:#EAEFF8; --ink-2:#C0CADC; --muted:#8992A6; --border:#262F40; --border-2:#313B4F;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 2px 12px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{margin:0; color:var(--ink); letter-spacing:-.01em;}
  h1,h2{font-family:"Fraunces","Georgia",serif; font-weight:600;}
  h3,h4{font-family:"Inter",sans-serif; font-weight:700;}
  .mono{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums;}
  p{margin:0;} ul,ol{margin:0;padding:0;list-style:none;} button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
  .shell{max-width:var(--maxw); margin:0 auto; padding-left:24px; padding-right:24px;}
  @media (max-width:640px){ .shell{padding-left:14px; padding-right:14px;} }

  .topbar{background:var(--navy); color:#fff;}
  .topbar-inner{max-width:var(--maxw); margin:0 auto; padding:14px 24px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .brand-mark{display:flex; align-items:center; gap:11px;}
  .brand-logo{width:34px;height:34px;border-radius:8px; background:var(--gold); display:flex;align-items:center;justify-content:center; font-family:"Fraunces",serif; font-weight:700; font-size:18px; color:#fff; flex:none;}
  .brand-title{font-family:"Fraunces",serif; font-weight:600; font-size:18px; color:#fff; display:block; line-height:1.15;}
  .brand-sub{font-size:11px; color:#AFC0DA; display:block;}
  .top-right{margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .icon-btn{display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.2); border-radius:8px; padding:7px 11px; font-size:12px; font-weight:600;}
  .icon-btn:hover{background:rgba(255,255,255,.18);}
  .icon-btn.data{background:var(--gold); border-color:var(--gold);}

  .rail{background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:env(safe-area-inset-top,0px); z-index:30;}
  .rail-inner{max-width:var(--maxw); margin:0 auto; padding:7px 24px; display:flex; align-items:center; gap:3px; flex-wrap:wrap;}
  .nav button{display:inline-flex; align-items:center; gap:8px; padding:8px 13px; border-radius:8px; color:var(--muted); font-weight:600; font-size:13px; background:transparent; border:1px solid transparent;}
  .nav button .sn{width:20px;height:20px;border-radius:5px; background:var(--surface-2); color:var(--muted); display:flex;align-items:center;justify-content:center; font-size:11px; font-weight:700; border:1px solid var(--border); font-family:"JetBrains Mono",monospace;}
  .nav button:hover{color:var(--ink); background:var(--surface-2);}
  .nav button.active{color:var(--ink); background:var(--accent-soft); border-color:var(--accent-line);}
  .nav button.active .sn{background:var(--accent); color:#fff; border-color:var(--accent);}

  main{padding:20px 0 48px;}
  .pagehead{margin-bottom:16px;}
  .pagehead h1{font-size:23px;}
  .pagehead .lead{font-size:13px; color:var(--muted); margin-top:3px; max-width:82ch;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:18px; overflow:hidden;}
  .card-head{display:flex; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid var(--border);}
  .card-head .ico{width:28px;height:28px;border-radius:7px; background:var(--accent-soft); color:var(--accent); display:flex;align-items:center;justify-content:center; font-size:14px; flex:none;}
  .card-head h3{font-size:14.5px;}
  .card-head .hsub{font-size:11.5px; color:var(--muted);}
  .card-head .right{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .card-body{padding:16px;}

  .note-strip{display:flex; gap:9px; padding:11px 16px; background:var(--paper); border-bottom:1px solid var(--border); font-size:12px; color:var(--ink-2); line-height:1.6;}
  .note-strip b{color:var(--ink);}

  .selbar{display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end;}
  .fld{display:flex; flex-direction:column; gap:4px; min-width:130px;}
  .fld label{font-size:10.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.05em;}
  select, input[type=number], input[type=text]{font-family:inherit; font-size:13px; padding:8px 10px; border:1px solid var(--border-2); border-radius:8px; background:var(--surface); color:var(--ink); min-width:0;}
  input[type=number]{font-family:"JetBrains Mono",monospace; text-align:right;}
  input[type=range]{accent-color:var(--accent); width:100%;}
  .seg{display:inline-flex; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:3px; gap:2px; flex-wrap:wrap; align-items:center;}
  .seg button{border:none; background:transparent; color:var(--ink-2); font-weight:700; font-size:12px; padding:6px 12px; border-radius:6px;}
  .seg button.on{background:var(--accent); color:#fff;}
  .seg input[type=number]{width:72px; margin-left:4px; padding:5px 7px;}
  .btn{display:inline-flex; align-items:center; gap:6px; background:var(--accent); color:#fff; border:none; border-radius:8px; padding:8px 13px; font-size:12.5px; font-weight:600;}
  .btn.ghost{background:var(--surface-2); color:var(--ink-2); border:1px solid var(--border);}
  .btn:hover{opacity:.92;}

  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:11px;}
  .tile{background:var(--paper); border:1px solid var(--border); border-radius:10px; padding:11px 12px;}
  .tile .tl{font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700;}
  .tile .tv{font-weight:700; font-size:18px; font-family:"JetBrains Mono",monospace; margin-top:4px;}
  .tile .tsub{font-size:10.5px; color:var(--muted); margin-top:2px;}
  .tile.hi{background:var(--accent-soft); border-color:var(--accent-line);}
  .tile.good{background:var(--green-soft); border-color:var(--green-line);}
  .tile.bad{background:var(--red-soft); border-color:var(--red-line);}
  .tile.warn{background:var(--amber-soft); border-color:var(--amber-line);}

  .npl-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:13px;}
  .npl{border:1px solid var(--border); border-radius:11px; background:var(--surface); padding:13px; cursor:pointer; display:flex; flex-direction:column; gap:8px; min-width:0;}
  .npl:hover{border-color:var(--accent-line);}
  .npl.sel{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent);}
  .npl.empty{border-style:dashed; background:var(--paper); align-items:center; justify-content:center; text-align:center; color:var(--muted); min-height:120px;}
  .npl .nh{display:flex; align-items:center; gap:10px;}
  .npl .emoji{width:38px;height:38px;border-radius:9px; background:var(--gold-soft); display:flex;align-items:center;justify-content:center; font-size:20px; flex:none;}
  .npl .nm{font-weight:700; font-size:14px;}
  .npl .sku{font-size:10.5px; color:var(--muted); font-family:"JetBrains Mono",monospace;}
  .npl .statrow{display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .npl .statrow>div{flex:1; padding:7px 9px; text-align:center;}
  .npl .statrow>div+div{border-left:1px solid var(--border);}
  .npl .statrow .sv{font-weight:700; font-size:14px; font-family:"JetBrains Mono",monospace;}
  .npl .statrow .sl{font-size:9px; color:var(--muted); text-transform:uppercase; margin-top:1px;}
  .chips{display:flex; flex-wrap:wrap; gap:5px;}
  .chip{font-size:10px; font-weight:700; padding:2px 8px; border-radius:999px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink-2); white-space:nowrap;}
  .chip.good{background:var(--green-soft); border-color:var(--green-line); color:var(--green);}
  .chip.warn{background:var(--amber-soft); border-color:var(--amber-line); color:var(--amber);}
  .chip.bad{background:var(--red-soft); border-color:var(--red-line); color:var(--red);}
  .chip.gold{background:var(--gold-soft); border-color:var(--gold-line); color:var(--gold);}
  .chip.brand{background:var(--navy); border-color:var(--navy); color:#fff;}
  .chip.blue{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent);}
  .roletag{display:inline-block; font-size:10px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; padding:3px 9px; border-radius:6px; background:var(--navy); color:#fff;}
  .callout{background:var(--accent-soft); border:1px solid var(--accent-line); border-radius:12px; padding:16px 18px; line-height:1.7; font-size:13px; color:var(--ink-2);}
  .callout b{color:var(--ink);} .callout .big{font-size:14.5px; font-weight:700; color:var(--ink); display:block; margin-bottom:8px;}
  .mcell{text-align:center !important; font-family:"JetBrains Mono",monospace;}
  .npl .why{font-size:11.5px; color:var(--ink-2); line-height:1.55;}
  .mini-btn{width:24px;height:24px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);color:var(--muted);font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .mini-btn:hover{color:var(--ink);border-color:var(--accent-line);}
  .photo-thumb{width:48px;height:48px;border-radius:9px;object-fit:cover;flex:none;border:1px solid var(--border);}
  .photo-thumb.ph-empty{background:var(--gold-soft);display:flex;align-items:center;justify-content:center;font-size:22px;}
  .photo-drop{border:1.5px dashed var(--border-2);border-radius:9px;padding:10px;text-align:center;background:var(--paper);color:var(--muted);font-size:11px;cursor:pointer;}
  .photo-drop:hover{border-color:var(--accent);}
  .photo-prev{max-width:100%;max-height:90px;border-radius:7px;object-fit:contain;}

  .table-wrap{overflow-x:auto;}
  table.dt{width:100%; border-collapse:collapse; font-size:12.5px; min-width:540px;}
  table.dt th, table.dt td{padding:8px 11px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap;}
  table.dt th{font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; background:var(--paper);}
  table.dt td.num, table.dt th.num{text-align:right; font-family:"JetBrains Mono",monospace;}
  table.dt tbody tr.click{cursor:pointer;}
  table.dt tbody tr.click:hover{background:var(--accent-soft);}
  table.dt tbody tr.sel{background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent);}
  table.dt tr.grp td{font-weight:700; background:var(--surface-2);}
  table.dt tr.hl td{background:var(--gold-soft);}
  table.dt td input{width:98px; padding:5px 7px; font-size:12px;}
  .delta-up{color:var(--green); font-weight:700;} .delta-dn{color:var(--red); font-weight:700;}
  .badge{display:inline-block; font-size:10px; font-weight:800; padding:2px 10px; border-radius:999px; border:1px solid;}
  .b-go{background:var(--green-soft); border-color:var(--green-line); color:var(--green);}
  .b-pilot{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent);}
  .b-rework,.b-hold{background:var(--amber-soft); border-color:var(--amber-line); color:var(--amber);}
  .b-nogo{background:var(--red-soft); border-color:var(--red-line); color:var(--red);}

  /* horizontal COGM matrix */
  table.matrix{border-collapse:collapse; font-size:12.5px;}
  table.matrix th,table.matrix td{border:1px solid var(--border); padding:7px 10px; white-space:nowrap;}
  table.matrix thead th{background:var(--navy); color:#fff; font-size:11px; font-weight:700; text-align:center;}
  table.matrix td.lab{text-align:left; color:var(--ink-2); background:var(--paper); font-weight:600; position:sticky; left:0;}
  table.matrix td.num{text-align:right; font-family:"JetBrains Mono",monospace;}
  table.matrix tr.sum td{font-weight:700; background:var(--surface-2);}
  table.matrix tr.sum td.lab{background:var(--surface-2);}
  table.matrix input{width:92px; padding:4px 6px; font-size:12px; text-align:right;}

  .aistobe{width:100%; border-collapse:collapse; font-size:12.5px;}
  .aistobe th,.aistobe td{padding:7px 11px; border-bottom:1px solid var(--border); white-space:nowrap;}
  .aistobe th{font-size:10px; text-transform:uppercase; color:var(--muted); font-weight:700; text-align:right;}
  .aistobe th:first-child{text-align:left;}
  .aistobe td.lab{text-align:left; color:var(--ink-2);}
  .aistobe td.sub{padding-left:24px; color:var(--muted); font-size:11.5px;}
  .aistobe td.num{text-align:right; font-family:"JetBrains Mono",monospace;}
  .aistobe .col-tobe{background:var(--accent-soft);}
  .aistobe tr.move td{font-weight:700;} .aistobe tr.move .col-tobe{color:var(--accent);}
  .aistobe tr.ebt td{font-weight:800; background:var(--gold-soft);}
  .aistobe tr.gp td{font-weight:700; background:var(--paper);}

  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--muted); margin-top:8px;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .legend i{width:10px;height:10px;border-radius:3px; display:inline-block;}
  .bars{display:flex; flex-direction:column; gap:6px;}
  .barrow{display:flex; align-items:center; gap:10px; font-size:12px;}
  .barrow .bl{width:160px; color:var(--ink-2); flex:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .barrow .bt{flex:1; background:var(--surface-2); border-radius:5px; height:18px; overflow:hidden; min-width:50px;}
  .barrow .bt i{display:block; height:100%;}
  .barrow .bv{width:66px; text-align:right; font-family:"JetBrains Mono",monospace; flex:none;}

  .reasons{display:flex; flex-direction:column; gap:7px;}
  .ri{display:flex; gap:8px; font-size:12.5px; color:var(--ink-2); align-items:flex-start; line-height:1.5;}
  .ri .ok{color:var(--green); font-weight:800;} .ri .no{color:var(--red); font-weight:800;} .ri .wn{color:var(--amber); font-weight:800;}
  .note{font-size:11.5px; color:var(--muted); line-height:1.6; margin-top:10px;}
  .srcbar{display:flex; gap:9px; align-items:flex-start; font-size:11px; color:var(--muted); background:var(--paper); border:1px dashed var(--border-2); border-radius:9px; padding:10px 12px; margin-top:14px; line-height:1.6;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:820px){ .grid2{grid-template-columns:1fr;} }
  .txt-green{color:var(--green);} .txt-amber{color:var(--amber);} .txt-red{color:var(--red);} .txt-muted{color:var(--muted);} .txt-accent{color:var(--accent);}
  .foot{max-width:var(--maxw); margin:6px auto 0; padding:16px 24px 34px; color:var(--muted); font-size:11px;}
  svg{display:block; max-width:100%;}

  /* tab5 map (full width) + why overlay */
  #mapBox{height:380px; border-radius:12px; overflow:hidden; position:relative; background:radial-gradient(130% 130% at 30% 18%, #1a3a63 0%, #0e2544 50%, #081a30 100%); border:1px solid var(--border);}
  .map-legend{position:absolute; top:10px; right:12px; display:flex; gap:10px; z-index:4; flex-wrap:wrap; justify-content:flex-end;}
  .map-legend span{display:inline-flex; align-items:center; gap:5px; font-size:10px; color:#d6e3f5; background:rgba(8,20,36,.6); padding:3px 7px; border-radius:999px;}
  .map-legend i{width:8px;height:8px;border-radius:50%;}
  .map-hint{position:absolute; bottom:12px; left:12px; z-index:4; font-size:11px; color:#d6e3f5; background:rgba(8,20,36,.6); padding:5px 11px; border-radius:999px;}
  .whyover{position:absolute; top:12px; left:12px; width:278px; max-width:calc(100% - 24px); z-index:5; background:var(--surface); border:1px solid var(--border); border-radius:11px; box-shadow:0 14px 38px rgba(5,11,24,.5); overflow:hidden; animation:popIn .16s ease-out;}
  @keyframes popIn{from{opacity:0; transform:translateY(6px) scale(.98);} to{opacity:1; transform:none;}}
  @media (max-width:560px){ .whyover{position:static; width:auto; margin:10px; } }
  .whyover .wh{display:flex; align-items:center; gap:9px; padding:10px 13px; border-bottom:1px solid var(--border);}
  .whyover .wh b{font-family:"Fraunces",serif; font-size:14px;}
  .whyover .wh .ws{font-family:"JetBrains Mono",monospace; font-weight:800; font-size:15px; color:#fff; border-radius:7px; padding:2px 9px;}
  .whyover .wh .wclose{margin-left:4px; width:24px;height:24px;border-radius:50%; border:1px solid var(--border); background:var(--surface-2); color:var(--muted); font-size:16px; line-height:1; display:flex;align-items:center;justify-content:center; flex:none;}
  .whyover .wrow{display:flex; justify-content:space-between; padding:5px 13px; font-size:12px; border-bottom:1px solid var(--border);}
  .whyover .wrow .wl{color:var(--muted);} .whyover .wrow .wv{font-family:"JetBrains Mono",monospace; font-weight:700;}
  .drill{display:flex; flex-wrap:wrap; gap:5px; padding:9px 13px; font-size:10.5px; color:var(--muted); line-height:1.6;}
  .drill b{color:var(--ink);}
  tr.detailrow:hover{background:var(--surface)!important;}
  tr.detailrow .detail{margin:0; border-radius:0; border-left:none; border-right:none;}

  .detail{border:1px solid var(--accent-line); border-radius:12px; margin-top:14px; overflow:hidden;}
  .detail-head{display:flex; align-items:center; gap:12px; padding:13px 16px; background:var(--surface); border-bottom:1px solid var(--border);}
  .detail-head .de{font-size:22px;}
  .detail-head h4{font-size:14.5px;}

  /* ============ PAGE 3 — Reverse EBT ============ */
  // Per-NPL forward P&L at its operating volume, for a country/channel/account.
  function nplPnl(c,b,mt,fees){
    var nsar=c.vol*c.dbp, cogm=c.vol*cogmAt(c.vol,c), gp1=nsar-cogm;
    function r(x){ return b[x]/b.nsar; }
    var sm1=r('sm1')*nsar, sm2=r('sm2')*nsar, sm3=r('sm3')*nsar, sm4=r('sm4')*nsar;
    var gp2=gp1-sm1-sm2-sm3-sm4;
    var ga1=r('ga1')*nsar, ga2=r('ga2')*nsar, ga3=r('ga3')*nsar;
    var list=mt?fees.list:0, trade=mt?fees.trade/100*nsar:0, ppn=fees.ppn;
    var ebt=gp2-ga1-ga2-ga3-list-trade;
    return {nsar:nsar,cogm:cogm,gp1:gp1,sm1:sm1,sm2:sm2,sm3:sm3,sm4:sm4,gp2:gp2,ga1:ga1,ga2:ga2,ga3:ga3,list:list,trade:trade,ppn:ppn,ebt:ebt,ebtPct:ebt/nsar*100};
  }

  /* ===== Reverse EBT → retail bridge → Nielsen market reality (ATOMIC logic) ===== */
  // EBT % at carton volume v, using the current P&L structure + utilization-adjusted COGM.
  function ebtPctAtVol(c,b,mt,fees,v){
    var nsar=v*c.dbp, cogm=v*cogmAt(v,c), gp1=nsar-cogm; function r(x){ return b[x]/b.nsar; }
    var sm=(r('sm1')+r('sm2')+r('sm3')+r('sm4'))*nsar, gp2=gp1-sm;
    var ga=(r('ga1')+r('ga2')+r('ga3'))*nsar, list=mt?fees.list:0, trade=mt?fees.trade/100*nsar:0;
    return (gp2-ga-list-trade)/nsar*100;
  }
  // Bisection solver: smallest monthly cartons that reaches the target EBT % within capacity.
  function solveReqCartons(c,b,mt,fees,targetPct){
    var cap=c.fullCap, lo=Math.max(1,cap*0.005), hi=cap;
    var eHi=ebtPctAtVol(c,b,mt,fees,hi);
    if(eHi<targetPct-1e-9) return {status:'NOT_REACHABLE', cartons:cap, util:1, ebtPct:eHi};
    if(ebtPctAtVol(c,b,mt,fees,lo)>=targetPct) { return {status:'SOLVED', cartons:lo, util:lo/cap, ebtPct:ebtPctAtVol(c,b,mt,fees,lo)}; }
    for(var i=0;i<60;i++){ var mid=(lo+hi)/2; if(ebtPctAtVol(c,b,mt,fees,mid)>=targetPct) hi=mid; else lo=mid; }
    return {status:'SOLVED', cartons:hi, util:hi/cap, ebtPct:ebtPctAtVol(c,b,mt,fees,hi)};
  }
  function srpOf(c){ return c.srp||500; } function ppcOf(c){ return c.ppc||300; }
  // Physical retail bridge + Nielsen required-share + feasibility for one NPL.
  function nielsenReality(c,b,mt,fees,targetPct){
    var sol=solveReqCartons(c,b,mt,fees,targetPct);
    var ppc=ppcOf(c), srp=srpOf(c);
    var retailM=sol.cartons*ppc*srp, retailMAT=retailM*12;           // retail-equivalent at SRP
    var catMkt=(NIELSEN.marketT||0)*1e6;                             // Nielsen market value (Rp)
    var catShare=catMkt?retailMAT/catMkt*100:null;
    // price-segment denominator (GT tiers from the uploaded Nielsen, matched to SRP)
    var seg=null; if(NIELSEN.segmentsGT){ var tier=srp<=500?500:srp<=1000?1000:srp<=2000?2000:'3000 UP';
      seg=NIELSEN.segmentsGT.filter(function(s){return ''+s.tier===''+tier;})[0]; }
    var segShare=(seg&&seg.val)?retailMAT/(seg.val*1e6)*100:null;
    var fl=flavor(c.nielsen), flavShare=(fl&&fl.val)?retailMAT/(fl.val*1e6)*100:null;
    // feasibility classification (simplified from the ATOMIC spec §19)
    var feas, fcls;
    if(sol.status==='NOT_REACHABLE'){ feas='NOT FEASIBLE'; fcls='bad'; }
    else if(sol.util>1){ feas='NOT FEASIBLE'; fcls='bad'; }
    else if(segShare==null && catShare==null){ feas='INSUFFICIENT DATA'; fcls='warn'; }
    else { var probe=segShare!=null?segShare:catShare;
      if(probe<=2){ feas='CONSERVATIVE'; fcls='good'; }
      else if(probe<=5){ feas='REASONABLE'; fcls='good'; }
      else if(probe<=12){ feas='AGGRESSIVE'; fcls='warn'; }
      else { feas='NOT FEASIBLE'; fcls='bad'; } }
    return {sol:sol, retailM:retailM, retailMAT:retailMAT, catShare:catShare, seg:seg, segShare:segShare, flavShare:flavShare, feas:feas, fcls:fcls};
  }

  /* ============ PAGE 4 — Market Share grouped by brand category ============ */
  // Category Opportunity Score for an NPL, from its mapped Indonesia category (opportunity stance).
  // The NPL is SIIP's own product in that category → assume solid equity (nab 4) and scale the
  // fragmented ID category contribution onto the same 0–45 size axis the engine uses.
  function nplCatScore(f){ if(!f) return 18; var o=catOpp({g:f.chg,size:Math.min(f.cont*2,45),nab:4},'opportunity'); return o.score; }
  function verdictCard(c){ var f=flavor(c.nielsen), v, reason, sc=nplCatScore(f);
    // verdict band is driven by the computed score, with declining / white-space overrides
    if(!f){ v='avoid'; reason=lang==='id'?'White space — demand belum terbukti, validasi dulu (pilot).':'White space — demand unproven, validate first (pilot).'; }
    else if(f.chg<0){ v='avoid'; reason=lang==='id'?'Kategori menurun '+pctS(f.chg)+' — hindari kecuali ada diferensiasi kuat.':'Category declining '+pctS(f.chg)+' — avoid unless strongly differentiated.'; }
    else if(sc>=60){ v='ride'; reason=lang==='id'?'Skor opportunity '+sc+'/100 — kategori tumbuh '+pctS(f.chg)+' & cukup besar ('+pct(f.cont)+' pasar). Tunggangi.':'Opportunity score '+sc+'/100 — category growing '+pctS(f.chg)+' & sizeable ('+pct(f.cont)+' of market). Ride it.'; }
    else if(sc>=45){ v='watch'; reason=lang==='id'?'Skor opportunity '+sc+'/100 — momentum sedang, launch selektif.':'Opportunity score '+sc+'/100 — moderate momentum, launch selectively.'; }
    else { v='avoid'; reason=lang==='id'?'Skor opportunity '+sc+'/100 — terlalu tipis, hindari kecuali diferensiasi kuat.':'Opportunity score '+sc+'/100 — too thin, avoid unless strongly differentiated.'; }
    var vb=v==='ride'?'b-go':v==='watch'?'b-rework':'b-nogo';
    var scCol=v==='ride'?'var(--green)':v==='watch'?'var(--gold)':'var(--red)';
    var scPill='<span style="font-family:\'JetBrains Mono\',monospace;font-weight:800;font-size:12px;color:#fff;background:'+scCol+';border-radius:6px;padding:1px 7px">'+sc+'</span>';
    return '<div class="npl" style="cursor:default"><div class="nh"><span class="emoji">'+c.emoji+'</span><div><div class="nm">'+c.name+'</div><div class="sku">'+(f?L(f.n)+' · '+pctS(f.chg):'white space')+'</div></div><div style="margin-left:auto;display:flex;gap:6px;align-items:center">'+scPill+'<span class="badge '+vb+'">'+t('v'+v.charAt(0).toUpperCase()+v.slice(1))+'</span></div></div><div class="why">'+reason+'</div></div>';
  }

  function dualLine(a,bArr,labelA,labelB,fmt){

    function X(i){ return pL+i/(n-1)*(W-pL-pR); } function Y(v){ return pT+(mx-v)/(mx-mn)*(H-pT-pB); }
    function poly(arr,col){ return '<polyline points="'+arr.map(function(v,i){return X(i)+','+Y(v);}).join(' ')+'" fill="none" stroke="'+col+'" stroke-width="2"/>'; }
    var end='<text x="'+X(n-1)+'" y="'+(Y(a[n-1])-5)+'" font-size="10" fill="var(--accent)" text-anchor="end" font-family="JetBrains Mono">'+(fmt?fmt(a[n-1]):a[n-1])+'</text>'+
      '<text x="'+X(n-1)+'" y="'+(Y(bArr[n-1])+12)+'" font-size="10" fill="var(--gold)" text-anchor="end" font-family="JetBrains Mono">'+(fmt?fmt(bArr[n-1]):bArr[n-1])+'</text>';
    return '<div class="table-wrap"><svg viewBox="0 0 '+W+' '+H+'">'+poly(a,'var(--accent)')+poly(bArr,'var(--gold)')+end+'</svg></div>'+

  function usdM(n){ return 'US$'+dec(n)+'M'; }

  function mapBlock(){
    var co=COUNTRY[st.mapCountry];
    var best=candidatesSingle().filter(function(e){return e.country===st.mapCountry;}).sort(function(a,b){return b.oppFinal-a.oppFinal;})[0];
    var score=best?best.oppFinal:0;
    var fl=best&&best.repFl;
    var mktSize = fl? fl.val*1e6 : null;
    var capturable = (fl&&best)? fl.val*1e6/12*CAPRATE[best.channel]*co.capF*(best.account.capF||1)*12 : null;
    var legend='<div class="map-legend"><span><i style="background:#1C8560"></i>≥70</span><span><i style="background:#B6873B"></i>50–69</span><span><i style="background:#C13A49"></i>&lt;50</span></div>';
    function wrow(l,v,cls){ return '<div class="wrow"><span class="wl">'+l+'</span><span class="wv '+(cls||'')+'">'+v+'</span></div>'; }
    var why = st.whyOpen ? '<div class="whyover" id="whyOver"><div class="wh"><span style="font-size:18px">'+co.flag+'</span><b style="flex:1">'+t('whyC',{c:st.mapCountry})+'</b><span class="ws" style="background:'+scoreColor(score)+'">'+score+'</span><button type="button" class="wclose" id="whyClose" aria-label="close">×</button></div>'+

      wrow(t('wCap'), capturable?rpShort(capturable):'—')+

      wrow(t('probSucc'), best?best.prob+'%':'—')+

      '<div class="sb-sec"><h4>'+t('upCogmT')+'</h4><div class="drop" id="dropCogm">'+t('upCogmH')+'<input type="file" id="fileCogm" accept=".xlsx,.xls" class="hidden"></div><div id="msgCogm" class="note"></div></div>'+
      '<div class="sb-sec"><h4>'+t('upPnlT')+'</h4><p class="note" style="margin:0 0 8px">'+t('upPnlH')+'</p><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn ghost" id="dlTpl">'+t('dlTemplate')+'</button><button class="btn ghost" id="impPnlBtn">'+t('impPnl')+'</button><input type="file" id="filePnl" accept=".json" class="hidden"></div><div id="msgPnl" class="note"></div></div>'+
      '<div class="sb-sec"><h4>JSON</h4><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn ghost" id="expAll">'+t('expAll')+'</button><button class="btn ghost" id="impAllBtn">'+t('impAll')+'</button><input type="file" id="fileAll" accept=".json" class="hidden"><button class="btn ghost" id="resetAll">'+t('resetAll')+'</button></div></div>'+
      '</div>';
    sb.classList.add('open'); sb.setAttribute('aria-hidden','false'); sc.classList.add('open');
    document.getElementById('sbClose').addEventListener('click',closeSidebar);
    wireSidebar();
  }
  function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('scrim').classList.remove('open'); }
  function wireSidebar(){
    var dc=document.getElementById('dropCogm'), fc=document.getElementById('fileCogm');
    if(dc&&fc){ dc.addEventListener('click',function(){fc.click();});
      ['dragover','dragenter'].forEach(function(ev){dc.addEventListener(ev,function(e){e.preventDefault();dc.classList.add('hot');});});
      ['dragleave','drop'].forEach(function(ev){dc.addEventListener(ev,function(e){e.preventDefault();dc.classList.remove('hot');});});
      dc.addEventListener('drop',function(e){if(e.dataTransfer.files[0])readWorkbook(e.dataTransfer.files[0]);});
      fc.addEventListener('change',function(){if(fc.files[0])readWorkbook(fc.files[0]);}); }
    var dlTpl=document.getElementById('dlTpl'); if(dlTpl) dlTpl.addEventListener('click',function(){ var tpl={countries:Object.keys(DATA.base).map(function(k){var b=DATA.base[k];return {code:k,name:b.name,nsar:b.nsar,cogs:b.cogs,sm1:b.sm1,sm2:b.sm2,sm3:b.sm3,sm4:b.sm4,ga1:b.ga1,ga2:b.ga2,ga3:b.ga3};})}; dl('npl-pnl-template.json',tpl); });
    var impPnl=document.getElementById('impPnlBtn'), fp=document.getElementById('filePnl');
    if(impPnl&&fp){ impPnl.addEventListener('click',function(){fp.click();}); fp.addEventListener('change',function(){ var f=fp.files[0]; if(!f)return; var rd=new FileReader(); rd.onload=function(){ try{ var o=JSON.parse(rd.result), n=0; (o.countries||[]).forEach(function(c){ if(DATA.base[c.code]){ ['nsar','cogs','sm1','sm2','sm3','sm4','ga1','ga2','ga3'].forEach(function(f){ if(c[f]!=null)DATA.base[c.code][f]=+c[f]; }); n++; } }); saveData(); var m=document.getElementById('msgPnl'); if(m){m.textContent=t('pnlOk',{n:n});m.className='note txt-green';} render(); }catch(e){ var m2=document.getElementById('msgPnl'); if(m2){m2.textContent=t('upErr');m2.className='note txt-red';} } }; rd.readAsText(f); }); }
    var expAll=document.getElementById('expAll'); if(expAll) expAll.addEventListener('click',function(){ dl('npl-atomic-data.json',DATA); });
    var impAll=document.getElementById('impAllBtn'), fa=document.getElementById('fileAll');
    if(impAll&&fa){ impAll.addEventListener('click',function(){fa.click();}); fa.addEventListener('change',function(){ var f=fa.files[0]; if(!f)return; var rd=new FileReader(); rd.onload=function(){ try{ DATA=JSON.parse(rd.result); saveData(); render(); }catch(e){} }; rd.readAsText(f); }); }
    var rs=document.getElementById('resetAll'); if(rs) rs.addEventListener('click',function(){ resetData(); render(); });
  }
  function dl(name,obj){ var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'})); a.download=name; a.click(); }

  /* ============ WORKBOOK INGEST — one upload cascades to every tab ============ */
  var FLAVKEY={'KENTANG GORENG':'kentang','CHOCOLATE':'choco','ROASTED CORN':'corn','CHEESE':'cheese','SEAWEED':'seaweed','POTATO BARBEQUE':'bbq','SEA SALT':'seasalt','UBI':'ubi','PEDAS LEVEL 15':'pedas','KALDU AYAM':'kaldu'};
  var FLAVID={kentang:'Kentang Goreng',choco:'Coklat',corn:'Jagung Bakar',cheese:'Keju',seaweed:'Seaweed (Nori)',bbq:'Potato Barbeque',seasalt:'Sea Salt',ubi:'Ubi',pedas:'Pedas Level 15',kaldu:'Kaldu Ayam'};
  function titleCase(s){ return (''+s).toLowerCase().replace(/\b\w/g,function(c){return c.toUpperCase();}); }
  function gridOf(wb,s){ return XLSX.utils.sheet_to_json(wb.Sheets[s],{header:1,blankrows:false,defval:''}); }
  function gnum(x){ var n=parseFloat(x); return isFinite(n)?n:null; }
  function detectWb(wb){ var s=wb.SheetNames; if(s.indexOf('COGM')>=0)return'cogm'; if(s.indexOf('FLAVOR')>=0&&s.indexOf('BRAND')>=0)return'nielsen'; if(s.indexOf('Calculator EBT')>=0||s.indexOf('MT Adjustments')>=0||s.indexOf('Summary')>=0)return'pnl'; return null; }

  // COGM workbook → update matching NPL cost stacks (RM/PM/DL/Listrik/Gas/Depre/OMC per carton)
  function ingestCogm(wb){
    var g=gridOf(wb,'COGM'), n=0; DATA.cogmTable=[];
    for(var i=1;i<g.length;i++){ var r=g[i]; if((''+r[1]).trim()==='')continue;
      var row={sku:r[0], desc:(''+r[1]).toUpperCase(), depreF:gnum(r[2]),omcF:gnum(r[3]),dl:gnum(r[4]),listrik:gnum(r[5]),gas:gnum(r[6]),rm:gnum(r[7]),pm:gnum(r[8])};
      DATA.cogmTable.push(row);
      // map the 3.5g GT NPL rows onto the demo NPLs
      var key=null; if(/NORI 3,5G GT/.test(row.desc))key='nori'; else if(/KARI 3,5G GT/.test(row.desc))key='kari'; else if(/KARAAGE 3,5G GT/.test(row.desc))key='karaage';
      if(key){ var c=npl(key); if(c&&row.rm!=null){ c.cogm={depreF:row.depreF,omcF:row.omcF,dl:row.dl,listrik:row.listrik,gas:row.gas,rm:row.rm,pm:row.pm}; n++; } }
    }
    return n;
  }
  // Nielsen workbook → rebuild FLAVOR / BRAND / SKU / GT price-segments (persisted in DATA.nielsen)
  function ingestNielsen(wb){
    var F=gridOf(wb,'FLAVOR'), flavors=[];
    for(var i=2;i<F.length;i++){ var r=F[i]; if(typeof r[0]!=='number')break; var nm=(''+r[1]).trim(), k=FLAVKEY[nm]||nm.toLowerCase().replace(/[^a-z]/g,'');
      flavors.push({k:k, n:{en:titleCase(nm), id:FLAVID[k]||titleCase(nm)}, val:gnum(r[3]), chg:+(gnum(r[4])*100).toFixed(1), cont:+(gnum(r[5])*100).toFixed(2), rank:r[0]}); }
    var B=gridOf(wb,'BRAND'), brands=[], marketT=null;
    for(var j=3;j<B.length;j++){ var b=B[j], bn=(''+b[1]).trim(); if(!bn)continue; if(bn==='SNACK EXTRUDED'){ marketT=gnum(b[2]); continue; } if(typeof b[0]!=='number')continue;
      brands.push({n:bn, val:gnum(b[2]), sh:gnum(b[7]), chg:gnum(b[3]), nd:gnum(b[12]), wd:gnum(b[15]), me:/SIIP/.test(bn)}); }
    var S=gridOf(wb,'SKU'), skus=[];
    for(var k2=3;k2<S.length;k2++){ var s=S[k2]; if(typeof s[0]!=='number')continue; skus.push({n:(''+s[1]).trim(), val:gnum(s[2]), price:gnum(s[12]), nd:gnum(s[15]), wd:gnum(s[18]), chg:gnum(s[3]), me:/SIIP/i.test(''+s[1])}); if(skus.length>=14)break; }
    var SP=gridOf(wb,'Segment Performance'), seg=[];
    for(var m=2;m<SP.length;m++){ var p=SP[m]; if((''+p[0]).trim()==='Indonesia General Trade'){ seg.push({tier:p[1], cont:+(gnum(p[2])*100).toFixed(1), val:gnum(p[3]), growth:+(gnum(p[4])*100).toFixed(1)}); } }
    var obj={flavors:flavors, brands:brands, skus:skus, segmentsGT:seg, marketT:marketT, period:'MAT TY · uploaded'};
    DATA.nielsen=obj; applyNielsen(obj);
    return flavors.length+brands.length+skus.length;
  }
  function applyNielsen(o){ if(!o)return; if(o.flavors)NIELSEN.flavors=o.flavors; if(o.brands)NIELSEN.brands=o.brands; if(o.skus)NIELSEN.skus=o.skus; if(o.marketT)NIELSEN.marketT=o.marketT; if(o.segmentsGT)NIELSEN.segmentsGT=o.segmentsGT; if(o.period)NIELSEN.period=o.period; }
  // PnL workbook → MT account fees (listing/trading/PPN) + per-country cost ratios
  function ingestPnl(wb){
    var n=0, CMAP={'IDM':'MT:IDM','CLUB 80':'MT:C80','SAT':'MT:ALF','REGULAR DB':'MT:DBR','99SM':'MT:99SM','MR DIY':'MT:DIY','2RM':'MT:MTI'};
    if(wb.SheetNames.indexOf('MT Adjustments')>=0){ var A=gridOf(wb,'MT Adjustments');
      for(var i=3;i<A.length;i++){ var r=A[i]; var ctry=(''+r[0]).trim(), acc=(''+r[1]).trim().toUpperCase();
        if(['Indonesia','China','Malaysia'].indexOf(ctry)<0 || !acc || gnum(r[2])==null)continue;
        var fk=null; Object.keys(CMAP).forEach(function(kw){ if(acc.indexOf(kw)>=0) fk=CMAP[kw]; });
        if(!fk)continue; var f=acctFee(fk); f.list=(gnum(r[4])||0)*1e9; f.trade=+( (gnum(r[5])||0)*100 ).toFixed(2); f.ppn=(gnum(r[7])||0)*1e9; n++; }
    }
    if(wb.SheetNames.indexOf('Summary')>=0){ var S=gridOf(wb,'Summary'), bmap={'Indonesia':'id','China':'cn','Malaysia':'my'};
      var seen={}; for(var j=3;j<S.length;j++){ var s=S[j]; var cc=(''+s[1]).trim(); var ctry2=(''+s[0]).trim(); var bk=bmap[ctry2];
        if(!bk || seen[bk] || /GT/i.test(cc)===false)continue; // use each country's GT row once
        var bse=DATA.base[bk]; if(!bse)continue; bse.nsar=1; bse.real=true;
        bse.sm1=Math.abs(gnum(s[5])||0); bse.sm2=Math.abs(gnum(s[6])||0); bse.sm3=Math.abs(gnum(s[7])||0); bse.sm4=Math.abs(gnum(s[8])||0);
        bse.ga1=Math.abs(gnum(s[10])||0); bse.cogs=1-(gnum(s[4])||0.45); seen[bk]=1; n++; }
    }
    return n;
  }
  function readWorkbook(file){
    var msg=document.getElementById('msgCogm');
    if(typeof XLSX==='undefined'){ if(msg){msg.textContent=t('upErr');msg.className='note txt-red';} return; }
    var rd=new FileReader(); rd.onload=function(){ try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'}), kind=detectWb(wb), n=0, label='';
      if(kind==='cogm'){ n=ingestCogm(wb); label=t('ingCogm',{n:n}); }
      else if(kind==='nielsen'){ n=ingestNielsen(wb); label=t('ingNielsen'); }
      else if(kind==='pnl'){ n=ingestPnl(wb); label=t('ingPnl',{n:n}); }
      else { if(msg){msg.textContent=t('ingUnknown');msg.className='note txt-red';} return; }
      saveData(); if(msg){msg.textContent=label;msg.className='note txt-green';} render();
    }catch(e){ if(msg){msg.textContent=t('upErr')+' '+(e&&e.message?('('+e.message+')'):'');msg.className='note txt-red';} } };
    rd.readAsArrayBuffer(file);
  }

  /* ============ render + wire ============ */
  function render(){
    document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent=t(el.getAttribute('data-i18n')); });
    document.documentElement.setAttribute('lang',lang);
    renderNav(); globe=null;
    if(st.page!==5) st.modal=null;
    document.getElementById('view').innerHTML=[page1,page2,page3,page4,page5][st.page-1]();
    wire();
    renderModal();
    if(st.page===5) setTimeout(initGlobe,30);
  }
  function wire(){
    document.querySelectorAll('.npl[data-k]').forEach(function(el){ el.addEventListener('click',function(ev){ if(ev.target.closest('.mini-btn'))return; st.sel=el.getAttribute('data-k'); render(); }); });
    document.querySelectorAll('[data-edit]').forEach(function(b){ b.addEventListener('click',function(ev){ ev.stopPropagation(); st.editKey=b.getAttribute('data-edit'); st.addOpen=false; render(); }); });
    document.querySelectorAll('[data-del]').forEach(function(b){ b.addEventListener('click',function(ev){ ev.stopPropagation(); var k=b.getAttribute('data-del'); if(DATA.npls.length<=1)return; DATA.npls=DATA.npls.filter(function(x){return x.k!==k;}); if(st.sel===k)st.sel=DATA.npls[0].k; saveData(); render(); }); });
    var add=document.getElementById('addSlot'); if(add) add.addEventListener('click',function(){ st.addOpen=true; st.editKey=null; render(); });
    var aPhoto=document.getElementById('aPhoto'), aPD=document.getElementById('aPhotoDrop');
    if(aPD&&aPhoto){ aPD.addEventListener('click',function(){aPhoto.click();}); aPhoto.addEventListener('change',function(){ var f=aPhoto.files[0]; if(!f)return; var rd=new FileReader(); rd.onload=function(){ window._npPhoto=rd.result; aPD.innerHTML='<img src="'+rd.result+'" class="photo-prev">'; aPD.appendChild(aPhoto); }; rd.readAsDataURL(f); }); }
    var aSave=document.getElementById('aSave'); if(aSave) aSave.addEventListener('click',function(){
      var name=(document.getElementById('aName').value||'New NPL').trim(), brand=document.getElementById('aBrand').value, cat=document.getElementById('aCat').value, rm=+document.getElementById('aRm').value||26000, price=+document.getElementById('aPrice').value||100000;
      var photo = window._npPhoto || (st.editKey?npl(st.editKey).photo:null);
      if(st.editKey){ var c=npl(st.editKey); c.name=name; c.brand=brand; c.nielsen=cat; c.cogm.rm=rm; c.price=price; c.photo=photo; st.editKey=null; }
      else { var base=npl(DATA.npls[0].k).cogm; DATA.npls.push({k:'npl'+Date.now(), name:name, sku:'3.5g', emoji:'🆕', brand:brand, nielsen:cat, fullCap:95256, dbp:94734.973, price:price, photo:photo, vol:95256, cogm:{depreF:base.depreF,omcF:base.omcF,dl:base.dl,listrik:base.listrik,gas:base.gas,rm:rm,pm:base.pm}}); st.addOpen=false; }
      window._npPhoto=null; saveData(); render(); });
    var aC=document.getElementById('aCancel'); if(aC) aC.addEventListener('click',function(){ window._npPhoto=null; st.addOpen=false; st.editKey=null; render(); });
    var sel=document.getElementById('nplSel'); if(sel) sel.addEventListener('change',function(){ st.sel=sel.value; render(); });
    // cogm matrix
    document.querySelectorAll('.matrix input[data-k]').forEach(function(inp){ inp.addEventListener('change',function(){ var c=npl(inp.getAttribute('data-k')), f=inp.getAttribute('data-f'), v=+inp.value||0;
      if(f==='dbp')c.dbp=v; else if(f==='fullCap'){c.fullCap=v; if(c.vol>v)c.vol=v;} else if(f==='vol')c.vol=v; else c.cogm[f]=v; saveData(); render(); }); });
    var sc=document.getElementById('sortChk'); if(sc) sc.addEventListener('change',function(){ st.sortBrand=sc.checked; render(); });
    // EBT P&L (tab 3)
    var bs=document.getElementById('baseSel'); if(bs) bs.addEventListener('change',function(){ st.base=bs.value; st.revAcc=null; render(); });
    var chS=document.getElementById('chSeg'); if(chS) chS.querySelectorAll('button').forEach(function(b){ b.addEventListener('click',function(){ st.revChannel=b.getAttribute('data-c'); st.revAcc=null; render(); }); });
    var acS=document.getElementById('accSel'); if(acS) acS.addEventListener('change',function(){ st.revAcc=acS.value; render(); });
    var curFee=function(){ var accts=accountsOf(baseCountryName(st.base),st.revChannel); var a=accts.filter(function(x){return x.k===st.revAcc;})[0]||accts[0]; return acctFee(st.revChannel+':'+a.k); };
    var fl1=document.getElementById('feeList'); if(fl1) fl1.addEventListener('change',function(){ curFee().list=+fl1.value||0; saveData(); render(); });
    var ft1=document.getElementById('feeTrade'); if(ft1) ft1.addEventListener('change',function(){ curFee().trade=+ft1.value||0; saveData(); render(); });
    var fp1=document.getElementById('feePpn'); if(fp1) fp1.addEventListener('change',function(){ curFee().ppn=+fp1.value||0; saveData(); render(); });
    // Reverse-EBT → Nielsen bridge inputs
    var et=document.getElementById('ebtTgt'); if(et) et.addEventListener('change',function(){ st.ebtTarget=+et.value||0; render(); });
    var bs2=document.getElementById('brSrp'); if(bs2) bs2.addEventListener('change',function(){ npl(st.sel).srp=+bs2.value||500; saveData(); render(); });
    var bp2=document.getElementById('brPpc'); if(bp2) bp2.addEventListener('change',function(){ npl(st.sel).ppc=+bp2.value||300; saveData(); render(); });
    // rank
    var opt=document.getElementById('optSeg'); if(opt) opt.querySelectorAll('button').forEach(function(b){ b.addEventListener('click',function(){ st.rankOpt=b.getAttribute('data-o'); st.selRank=-1; render(); }); });
    var rt=document.getElementById('rankT'); if(rt) rt.querySelectorAll('tbody tr.click').forEach(function(tr){ tr.addEventListener('click',function(){ openModal(+tr.getAttribute('data-i')); }); });
    var wc=document.getElementById('whyClose'); if(wc) wc.addEventListener('click',function(){ st.whyOpen=false; render(); });
    // market switcher (tab 4)
    var mkt=document.getElementById('mktSeg'); if(mkt) mkt.querySelectorAll('button').forEach(function(b){ b.addEventListener('click',function(){ st.mktSel=b.getAttribute('data-m'); render(); window.scrollTo(0,0); }); });
    wireModal();
  }
  function openModal(i){ st.modal=i; render(); }
  function closeModal(){ st.modal=null; render(); }
  function wireModal(){
    var mc=document.getElementById('modalClose'); if(mc) mc.addEventListener('click',closeModal);
    var mw=document.getElementById('modalWrap'); if(mw) mw.addEventListener('click',function(e){ if(e.target===mw) closeModal(); });
  }
  function renderModal(){
    var host=document.getElementById('modalHost'); if(!host) return;
    if(st.modal==null || !window._rankEvals || !window._rankEvals[st.modal]){ host.innerHTML=''; return; }
    var e=window._rankEvals[st.modal], sku=e.members.map(function(m){return m.emoji+' '+m.name;}).join(' + ');
    host.innerHTML='<div class="modal-wrap" id="modalWrap"><div class="modal"><div class="modal-head"><span style="font-size:22px">'+e.members[0].emoji+'</span><div><h3>'+sku+'</h3><div style="font-size:11.5px;color:var(--muted)">'+areaLabel(e)+'</div></div><button class="modal-close" id="modalClose">×</button></div><div class="modal-body">'+comboDetail(e,true)+'</div></div></div>';
    wireModal();
  }

  /* ============ theme + lang + data btn ============ */
  function applyTheme(mode){ var r=document.documentElement; if(mode==='light')r.setAttribute('data-theme','light'); else if(mode==='dark')r.setAttribute('data-theme','dark'); else r.removeAttribute('data-theme');
    var lbl=document.getElementById('themeLabel'); if(lbl)lbl.textContent=mode==='light'?(lang==='id'?'Terang':'Light'):mode==='dark'?(lang==='id'?'Gelap':'Dark'):(lang==='id'?'Sistem':'System'); try{localStorage.setItem('nple-theme',mode);}catch(e){} }
  (function(){ var s='system'; try{s=localStorage.getItem('nple-theme')||'system';}catch(e){} applyTheme(s);
    document.getElementById('themeBtn').addEventListener('click',function(){ var c='system'; try{c=localStorage.getItem('nple-theme')||'system';}catch(e){} applyTheme(c==='system'?'light':c==='light'?'dark':'system'); }); })();
  document.getElementById('langBtn').addEventListener('click',function(){ lang=lang==='en'?'id':'en'; lset('nple-lang',lang); document.getElementById('langLabel').textContent=lang==='id'?'ID':'EN'; render(); });
  document.getElementById('langLabel').textContent=lang==='id'?'ID':'EN';
  document.getElementById('dataBtn').addEventListener('click',openSidebar);
  document.getElementById('scrim').addEventListener('click',closeSidebar);

  render();
})();
</script>
