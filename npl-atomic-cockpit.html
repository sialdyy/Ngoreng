<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NPL Atomic Launch Engine</title>
<meta name="description" content="Atomic P&L decision engine for SIIP new-product launches: editable COGM, as-is/to-be reverse EBT, Nielsen market share with a world map, and an SKU-by-area launch ranking with full scoring. Data is uploadable and persists in the browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.34.4/dist/globe.gl.min.js"></script>
<style>
  /* identity: executive navy + warm paper; Fraunces display, Inter body, JetBrains data. minimal motion. */
  :root{
    --navy:#122B46; --navy-2:#1C3D5E; --accent:#2F6BD8; --accent-soft:#EAF1FC; --accent-line:#C6DAF6;
    --gold:#B6873B; --gold-soft:#FAF3E6; --gold-line:#ECDBB8;
    --green:#1C8560; --green-soft:#E7F5EF; --green-line:#C2E6D5;
    --amber:#B0781C; --amber-soft:#FBF2E0; --amber-line:#EFDCB2;
    --red:#C13A49; --red-soft:#FBEAEC; --red-line:#F1C6CB;
    --bg:#F5F6F4; --surface:#FFFFFF; --surface-2:#F0F1EE; --paper:#FBFAF7;
    --ink:#1A2230; --ink-2:#44506A; --muted:#6B7488; --border:#E0E2DD; --border-2:#D3D6CF;
    --shadow:0 1px 2px rgba(18,43,70,.05), 0 2px 10px rgba(18,43,70,.06);
    --maxw:1200px; --radius:12px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --navy:#0C1826; --navy-2:#14293E; --accent:#5F92EC; --accent-soft:#15233A; --accent-line:#2B4066;
    --gold:#D6A354; --gold-soft:#2A2113; --gold-line:#574023;
    --green:#3FBB8D; --green-soft:#11271F; --green-line:#235541;
    --amber:#DCA54C; --amber-soft:#2A2012; --amber-line:#574123;
    --red:#E26C79; --red-soft:#2B1418; --red-line:#5A2930;
    --bg:#0A0E15; --surface:#111826; --surface-2:#19212F; --paper:#141B28;
    --ink:#EAEFF8; --ink-2:#C0CADC; --muted:#8992A6; --border:#262F40; --border-2:#313B4F;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 2px 12px rgba(0,0,0,.35);
    color-scheme: dark;
  }}
  :root[data-theme="dark"]{
    --navy:#0C1826; --navy-2:#14293E; --accent:#5F92EC; --accent-soft:#15233A; --accent-line:#2B4066;
    --gold:#D6A354; --gold-soft:#2A2113; --gold-line:#574023;
    --green:#3FBB8D; --green-soft:#11271F; --green-line:#235541;
    --amber:#DCA54C; --amber-soft:#2A2012; --amber-line:#574123;
    --red:#E26C79; --red-soft:#2B1418; --red-line:#5A2930;
    --bg:#0A0E15; --surface:#111826; --surface-2:#19212F; --paper:#141B28;
    --ink:#EAEFF8; --ink-2:#C0CADC; --muted:#8992A6; --border:#262F40; --border-2:#313B4F;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 2px 12px rgba(0,0,0,.35);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg); color:var(--ink); font-family:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; font-size:13.5px; line-height:1.55; -webkit-font-smoothing:antialiased;}
  h1,h2,h3,h4{margin:0; color:var(--ink); letter-spacing:-.01em;}
  h1,h2{font-family:"Fraunces","Georgia",serif; font-weight:600;}
  h3,h4{font-family:"Inter",sans-serif; font-weight:700;}
  .mono{font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums;}
  p{margin:0;} ul,ol{margin:0;padding:0;list-style:none;} button{font-family:inherit;cursor:pointer;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
  .shell{max-width:var(--maxw); margin:0 auto; padding-left:22px; padding-right:22px;}
  @media (max-width:640px){ .shell{padding-left:14px; padding-right:14px;} }

  .topbar{background:var(--navy); color:#fff;}
  .topbar-inner{max-width:var(--maxw); margin:0 auto; padding:14px 22px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  .brand-mark{display:flex; align-items:center; gap:11px;}
  .brand-logo{width:34px;height:34px;border-radius:8px; background:var(--gold); display:flex;align-items:center;justify-content:center; font-family:"Fraunces",serif; font-weight:700; font-size:18px; color:#fff; flex:none;}
  .brand-title{font-family:"Fraunces",serif; font-weight:600; font-size:18px; color:#fff; display:block; line-height:1.15;}
  .brand-sub{font-size:11px; color:#AFC0DA; display:block;}
  .top-right{margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .icon-btn{display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.2); border-radius:8px; padding:6px 11px; font-size:12px; font-weight:600;}
  .icon-btn:hover{background:rgba(255,255,255,.18);}

  .rail{background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:env(safe-area-inset-top,0px); z-index:30;}
  .rail-inner{max-width:var(--maxw); margin:0 auto; padding:7px 22px; display:flex; align-items:center; gap:4px; flex-wrap:wrap;}
  .nav{display:flex; align-items:center; gap:2px; flex-wrap:wrap;}
  .nav button{display:inline-flex; align-items:center; gap:7px; padding:7px 12px; border-radius:8px; color:var(--muted); font-weight:600; font-size:12.5px; background:transparent; border:1px solid transparent;}
  .nav button .sn{width:19px;height:19px;border-radius:5px; background:var(--surface-2); color:var(--muted); display:flex;align-items:center;justify-content:center; font-size:10.5px; font-weight:700; border:1px solid var(--border); font-family:"JetBrains Mono",monospace;}
  .nav button:hover{color:var(--ink); background:var(--surface-2);}
  .nav button.active{color:var(--ink); background:var(--accent-soft); border-color:var(--accent-line);}
  .nav button.active .sn{background:var(--accent); color:#fff; border-color:var(--accent);}
  .nav .dataBtn{margin-left:6px; color:var(--muted);}
  .nav .dataBtn.active{color:var(--gold); background:var(--gold-soft); border-color:var(--gold-line);}

  main{padding:18px 0 46px;}
  .pagehead{margin-bottom:14px;}
  .pagehead h1{font-size:22px;}
  .pagehead .lead{font-size:12.5px; color:var(--muted); margin-top:2px; max-width:80ch;}

  .card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:16px; overflow:hidden;}
  .card-head{display:flex; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid var(--border);}
  .card-head .ico{width:28px;height:28px;border-radius:7px; background:var(--accent-soft); color:var(--accent); display:flex;align-items:center;justify-content:center; font-size:14px; flex:none;}
  .card-head h3{font-size:14px; color:var(--ink);}
  .card-head .hsub{font-size:11px; color:var(--muted);}
  .card-head .right{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .card-body{padding:16px;}

  .note-strip{display:flex; gap:9px; padding:10px 16px; background:var(--paper); border-bottom:1px solid var(--border); font-size:11.5px; color:var(--ink-2); line-height:1.55;}
  .note-strip b{color:var(--ink);}

  .selbar{display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end;}
  .fld{display:flex; flex-direction:column; gap:4px; min-width:130px;}
  .fld label{font-size:10.5px; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em;}
  select, input[type=number], input[type=text]{font-family:inherit; font-size:13px; padding:8px 10px; border:1px solid var(--border-2); border-radius:8px; background:var(--surface); color:var(--ink); min-width:0;}
  input[type=number]{font-family:"JetBrains Mono",monospace; text-align:right; width:118px;}
  input[type=range]{accent-color:var(--accent); width:100%;}
  .seg{display:inline-flex; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:3px; gap:2px; flex-wrap:wrap;}
  .seg button{border:none; background:transparent; color:var(--ink-2); font-weight:700; font-size:12px; padding:6px 12px; border-radius:6px;}
  .seg button.on{background:var(--accent); color:#fff;}
  .slider-head{display:flex; justify-content:space-between; font-size:11px; color:var(--muted); font-weight:700; margin-bottom:4px;}
  .slider-head b{color:var(--ink); font-family:"JetBrains Mono",monospace;}
  .btn{display:inline-flex; align-items:center; gap:6px; background:var(--accent); color:#fff; border:none; border-radius:8px; padding:8px 13px; font-size:12.5px; font-weight:600;}
  .btn.ghost{background:var(--surface-2); color:var(--ink-2); border:1px solid var(--border);}
  .btn:hover{opacity:.92;}

  .tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px;}
  .tile{background:var(--paper); border:1px solid var(--border); border-radius:10px; padding:11px 12px;}
  .tile .tl{font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700;}
  .tile .tv{font-weight:700; font-size:18px; font-family:"JetBrains Mono",monospace; margin-top:4px;}
  .tile .tsub{font-size:10.5px; color:var(--muted); margin-top:2px;}
  .tile.hi{background:var(--accent-soft); border-color:var(--accent-line);}
  .tile.good{background:var(--green-soft); border-color:var(--green-line);}
  .tile.bad{background:var(--red-soft); border-color:var(--red-line);}
  .tile.warn{background:var(--amber-soft); border-color:var(--amber-line);}

  .npl-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(248px,1fr)); gap:12px;}
  .npl{border:1px solid var(--border); border-radius:11px; background:var(--surface); padding:13px; cursor:pointer; display:flex; flex-direction:column; gap:8px; min-width:0;}
  .npl:hover{border-color:var(--accent-line);}
  .npl.sel{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent);}
  .npl.empty{border-style:dashed; background:var(--paper); align-items:center; justify-content:center; text-align:center; color:var(--muted); min-height:118px;}
  .npl .nh{display:flex; align-items:center; gap:10px;}
  .npl .emoji{width:38px;height:38px;border-radius:9px; background:var(--gold-soft); display:flex;align-items:center;justify-content:center; font-size:20px; flex:none;}
  .npl .nm{font-weight:700; font-size:14px;}
  .npl .sku{font-size:10.5px; color:var(--muted); font-family:"JetBrains Mono",monospace;}
  .npl .statrow{display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
  .npl .statrow>div{flex:1; padding:7px 9px; text-align:center;}
  .npl .statrow>div+div{border-left:1px solid var(--border);}
  .npl .statrow .sv{font-weight:700; font-size:14px; font-family:"JetBrains Mono",monospace;}
  .npl .statrow .sl{font-size:9px; color:var(--muted); text-transform:uppercase; margin-top:1px;}
  .chips{display:flex; flex-wrap:wrap; gap:5px;}
  .chip{font-size:10px; font-weight:700; padding:2px 8px; border-radius:999px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink-2); white-space:nowrap;}
  .chip.good{background:var(--green-soft); border-color:var(--green-line); color:var(--green);}
  .chip.warn{background:var(--amber-soft); border-color:var(--amber-line); color:var(--amber);}
  .chip.bad{background:var(--red-soft); border-color:var(--red-line); color:var(--red);}
  .chip.gold{background:var(--gold-soft); border-color:var(--gold-line); color:var(--gold);}
  .npl .why{font-size:11.5px; color:var(--ink-2); line-height:1.5;}

  .table-wrap{overflow-x:auto;}
  table.dt{width:100%; border-collapse:collapse; font-size:12.5px; min-width:540px;}
  table.dt th, table.dt td{padding:8px 11px; border-bottom:1px solid var(--border); text-align:left; white-space:nowrap;}
  table.dt th{font-size:10px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); font-weight:700; background:var(--paper);}
  table.dt td.num, table.dt th.num{text-align:right; font-family:"JetBrains Mono",monospace;}
  table.dt tbody tr.click{cursor:pointer;}
  table.dt tbody tr.click:hover{background:var(--accent-soft);}
  table.dt tbody tr.sel{background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent);}
  table.dt tr.grp td{font-weight:700; background:var(--surface-2);}
  table.dt tr.hl td{background:var(--gold-soft);}
  table.dt td input[type=number]{width:104px; padding:5px 7px;}
  .delta-up{color:var(--green); font-weight:700;} .delta-dn{color:var(--red); font-weight:700;}
  .badge{display:inline-block; font-size:10px; font-weight:800; padding:2px 10px; border-radius:999px; border:1px solid;}
  .b-go{background:var(--green-soft); border-color:var(--green-line); color:var(--green);}
  .b-pilot{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent);}
  .b-rework{background:var(--amber-soft); border-color:var(--amber-line); color:var(--amber);}
  .b-hold{background:var(--red-soft); border-color:var(--red-line); color:var(--red);}

  .aistobe{width:100%; border-collapse:collapse; font-size:12.5px;}
  .aistobe th,.aistobe td{padding:8px 11px; border-bottom:1px solid var(--border); white-space:nowrap;}
  .aistobe th{font-size:10px; text-transform:uppercase; color:var(--muted); font-weight:700; text-align:right;}
  .aistobe th:first-child{text-align:left;}
  .aistobe td.lab{text-align:left; color:var(--ink-2);}
  .aistobe td.num{text-align:right; font-family:"JetBrains Mono",monospace;}
  .aistobe .col-tobe{background:var(--accent-soft);}
  .aistobe tr.move td{font-weight:700;} .aistobe tr.move .col-tobe{color:var(--accent);}
  .aistobe tr.ebt td{font-weight:800; background:var(--gold-soft);}
  .aistobe tr.gp td{font-weight:700;}

  .capmeter{height:26px; border-radius:7px; background:var(--surface-2); border:1px solid var(--border); position:relative; overflow:hidden;}
  .capmeter .fill{position:absolute; top:0; bottom:0; left:0;}
  .capmeter .mk{position:absolute; top:-3px; bottom:-3px; width:2px; background:var(--ink); opacity:.45;}
  .capmeter .mk span{position:absolute; top:-14px; left:50%; transform:translateX(-50%); font-size:9px; color:var(--muted); white-space:nowrap; font-weight:700;}

  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--muted); margin-top:8px;}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .legend i{width:10px;height:10px;border-radius:3px; display:inline-block;}
  .bars{display:flex; flex-direction:column; gap:6px;}
  .barrow{display:flex; align-items:center; gap:10px; font-size:12px;}
  .barrow .bl{width:150px; color:var(--ink-2); flex:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .barrow .bt{flex:1; background:var(--surface-2); border-radius:5px; height:18px; overflow:hidden; min-width:60px;}
  .barrow .bt i{display:block; height:100%;}
  .barrow .bv{width:66px; text-align:right; font-family:"JetBrains Mono",monospace; flex:none;}

  .reasons{display:flex; flex-direction:column; gap:6px;}
  .ri{display:flex; gap:8px; font-size:12px; color:var(--ink-2); align-items:flex-start;}
  .ri .ok{color:var(--green); font-weight:800;} .ri .no{color:var(--red); font-weight:800;} .ri .wn{color:var(--amber); font-weight:800;}
  .note{font-size:11px; color:var(--muted); line-height:1.6; margin-top:10px;}
  .srcbar{display:flex; gap:9px; align-items:flex-start; font-size:11px; color:var(--muted); background:var(--paper); border:1px dashed var(--border-2); border-radius:9px; padding:9px 12px; margin-top:12px; line-height:1.55;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:820px){ .grid2{grid-template-columns:1fr;} }
  .txt-green{color:var(--green);} .txt-amber{color:var(--amber);} .txt-red{color:var(--red);} .txt-muted{color:var(--muted);} .txt-accent{color:var(--accent);}
  .foot{max-width:var(--maxw); margin:6px auto 0; padding:14px 22px 34px; color:var(--muted); font-size:11px;}
  svg{display:block; max-width:100%;}

  /* globe + market layout */
  .mkt-wrap{display:grid; grid-template-columns:380px 1fr; gap:18px; align-items:start;}
  @media (max-width:860px){ .mkt-wrap{grid-template-columns:1fr;} }
  #globeBox{height:360px; border-radius:12px; overflow:hidden; background:radial-gradient(130% 130% at 30% 20%, #16365e 0%, #0c203a 55%, #081627 100%); border:1px solid var(--border); position:relative;}
  .globe-cap{position:absolute; left:12px; bottom:10px; color:#cfe0f5; font-size:11px; z-index:2;}
  .cmb{display:flex; gap:10px; align-items:center; padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:var(--surface); margin-bottom:9px; cursor:pointer;}
  .cmb:hover{border-color:var(--accent-line);}
  .cmb .ce{font-size:20px;}
  .cmb .cn{font-weight:700; font-size:13px;}
  .cmb .cs{font-size:11px; color:var(--muted);}
  .cmb .cv{margin-left:auto; text-align:right;}

  /* detail panel (ranking) */
  .detail{border:1px solid var(--accent-line); background:var(--accent-soft); border-radius:12px; padding:0; margin-top:14px; overflow:hidden;}
  .detail-head{display:flex; align-items:center; gap:12px; padding:13px 16px; background:var(--surface); border-bottom:1px solid var(--border);}
  .detail-head .de{font-size:24px;}
  .detail-head h4{font-size:15px; font-family:"Fraunces",serif; font-weight:600;}
  .detail-head .dsub{font-size:11.5px; color:var(--muted);}
  .detail-head .dcall{margin-left:auto;}
  .detail-body{padding:16px; background:var(--surface);}
  .scorebars{display:flex; flex-direction:column; gap:9px; margin-top:4px;}
  .sb{display:flex; align-items:center; gap:10px; font-size:12px;}
  .sb .sbl{width:140px; flex:none; color:var(--ink-2);}
  .sb .sbt{flex:1; background:var(--surface-2); border-radius:5px; height:16px; overflow:hidden; min-width:60px;}
  .sb .sbt i{display:block;height:100%;background:var(--accent);}
  .sb .sbv{width:54px; text-align:right; font-family:"JetBrains Mono",monospace; flex:none;}
  .kpi4{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
  @media (max-width:560px){ .kpi4{grid-template-columns:repeat(2,1fr);} }
  .kpi{text-align:center; border:1px solid var(--border); border-radius:10px; padding:10px; background:var(--paper);}
  .kpi .kv{font-weight:700; font-size:18px; font-family:"JetBrains Mono",monospace;}
  .kpi .kl{font-size:10px; color:var(--muted); text-transform:uppercase; margin-top:2px;}

  .drop{border:1.5px dashed var(--border-2); border-radius:12px; padding:22px; text-align:center; background:var(--paper); color:var(--muted);}
  .drop.hot{border-color:var(--accent); background:var(--accent-soft); color:var(--ink);}
  .hidden{display:none;}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand-mark">
      <div class="brand-logo">S</div>
      <div><span class="brand-title">NPL Atomic Launch Engine</span><span class="brand-sub" data-i18n="brandSub">SIIP · concept to best launch area</span></div>
    </div>
    <div class="top-right">
      <button type="button" class="icon-btn" id="langBtn">🌐 <span id="langLabel">EN</span></button>
      <button type="button" class="icon-btn" id="themeBtn">◐ <span id="themeLabel">System</span></button>
    </div>
  </div>
</header>

<nav class="rail"><div class="rail-inner"><div class="nav" id="nav"></div></div></nav>

<main><div class="shell"><div id="view"></div></div></main>
<footer class="foot"><span data-i18n="footBrand">Atomic P&L — what kills an NPL is EBT, not GP1. The first atom cell must not lose money.</span></footer>

<script>
(function(){
  "use strict";
  function lget(k,f){ try{ var r=localStorage.getItem(k); if(r) return JSON.parse(r);}catch(e){} return f; }
  function lset(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  var lang = lget('npla-lang','en');

  /* ========== DEFAULT DATA (real SIIP workbook + Nielsen audit) ========== */
  function defaultData(){ return {
    eng:{ fullCap:95256, dbp:94734.973 },
    npls:[
      {k:'nori', name:'SIIP Nori', sku:'3.5g', emoji:'🍙', nielsen:'seaweed',

          '<input type="range" id="volR" min="20000" max="'+Math.round(e.fullCap)+'" step="1000" value="'+Math.min(st.vol,e.fullCap)+'">'+
          '<div class="capmeter" id="capM" style="margin-top:7px">'+capFill(st.vol)+'</div></div>'+

        '<div><h4 style="font-size:12.5px;margin-bottom:8px">'+t('curveT')+' — '+c.name+'</h4><div id="cogmCurve">'+cogmCurve(c)+'</div></div></div>'+
      srcbar('cogm')+'</div>';

  }
  function cogmTiles(c){
    var cg=cogmAt(st.vol,c), gp=gpPctAt(st.vol,c), util=st.vol/ENG().fullCap*100, m=ENG().dbp-cg;
    return tile(t('util'),pct(util,0),util>=80?'good':util<45?'bad':'warn',grp(st.vol)+' / '+grp(ENG().fullCap))+
      tile(t('cogmCtn'),rpFull(cg),cg<=70000?'good':cg>=78000?'bad':'warn','')+
      tile(t('gpPct'),pct(gp),gp>=22?'good':gp<16?'bad':'warn','')+
      tile(t('marginCtn'),rpFull(m),'hi','');
  }
  function cogmTable(c){
    var g=c.cogm, cg=cogmFull(c);
    function r(key,field,fixed){ var v=g[field]; return '<tr><td class="lab">'+t(key)+(fixed?' <span class="chip warn" style="font-size:9px">'+(lang==='id'?'tetap/bln':'fixed/mo')+'</span>':'')+'</td>'+
      '<td class="num"><input type="number" data-f="'+field+'" value="'+(Math.round(v*100)/100)+'" step="100"></td>'+
      '<td class="num txt-muted">'+pct(v/cg*100)+'</td></tr>'; }
    return '<div class="table-wrap"><table class="dt" id="cogmInputs" style="min-width:380px"><thead><tr><th>'+t('line')+'</th><th class="num">'+t('perCtn')+'</th><th class="num">'+t('pctCogm')+'</th></tr></thead><tbody>'+
      r('lDepre','depreF',true)+r('lOmc','omcF',true)+r('lDl','dl')+r('lListrik','listrik')+r('lGas','gas')+r('lRm','rm')+r('lPm','pm')+
      '<tr class="grp"><td>'+t('lTot')+'</td><td class="num">'+rpFull(cg)+'</td><td class="num">100%</td></tr></tbody></table></div>';
  }
  function capFill(vol){ var e=ENG(),u=vol/e.fullCap*100; return '<div class="fill" style="width:'+Math.min(100,u)+'%;background:'+(u>=80?'var(--green)':u>=45?'var(--amber)':'var(--red)')+'"></div><div class="mk" style="left:'+(Math.min(100,30000/e.fullCap*100))+'%"><span>1/3</span></div><div class="mk" style="left:100%"><span>'+t('atFull')+'</span></div>'; }
  function cogmCurve(c){
    var e=ENG(), W=560,H=220,pL=54,pR=14,pT=12,pB=32, vmin=Math.max(15000,e.fullCap*0.2),vmax=e.fullCap;
    var cvals=[]; for(var v=vmin;v<=vmax;v+=(vmax-vmin)/40) cvals.push(cogmAt(v,c));
    var cmin=Math.min.apply(null,cvals)*0.99, cmax=Math.max.apply(null,cvals)*1.01;
    function X(v){ return pL+(v-vmin)/(vmax-vmin)*(W-pL-pR); }
    function Y(cg){ return pT+(cmax-cg)/(cmax-cmin)*(H-pT-pB); }
    var pts=[]; for(var v2=vmin;v2<=vmax;v2+=(vmax-vmin)/60) pts.push(X(v2)+','+Y(cogmAt(v2,c)));
    var xt=[0.25,0.5,0.75,1].map(function(f){ var v=vmin+(vmax-vmin)*f; return '<text x="'+X(v)+'" y="'+(H-pB+15)+'" font-size="10" fill="var(--muted)" text-anchor="middle" font-family="JetBrains Mono">'+Math.round(v/1000)+'k</text>'; }).join('');
    var yt=[cmin,(cmin+cmax)/2,cmax].map(function(cg){ return '<line x1="'+pL+'" y1="'+Y(cg)+'" x2="'+(W-pR)+'" y2="'+Y(cg)+'" stroke="var(--border)" opacity=".6"/><text x="'+(pL-7)+'" y="'+(Y(cg)+3)+'" font-size="10" fill="var(--muted)" text-anchor="end" font-family="JetBrains Mono">'+Math.round(cg/1000)+'k</text>'; }).join('');
    var cur=st.vol>=vmin&&st.vol<=vmax?'<circle cx="'+X(st.vol)+'" cy="'+Y(cogmAt(st.vol,c))+'" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>':'';
    return '<div class="table-wrap"><svg viewBox="0 0 '+W+' '+H+'">'+yt+xt+'<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--accent)" stroke-width="2.5"/>'+cur+'</svg></div>';
  }

  /* ========== PAGE 3 — Reverse EBT ========== */
  function reverse(b,rc,target){ var O=baseFixed(b), d=1-rc-target; if(d<=0) return {feasible:false}; var ns=O/d; return {feasible:true,O:O,ns:ns,cogm:rc*ns,ebt:target*ns,gp1:ns-rc*ns}; }
  function page3(){
    var c=npl(st.sel), b=BASE[st.base], rc=cogmFull(c)/ENG().dbp;
    var target = st.target==='custom' ? st.customT/100 : st.target;
    var asis=baseEbt(b), r=reverse(b,rc,target);
    var baseSel='<select id="baseSel">'+Object.keys(BASE).map(function(k){var x=BASE[k];return '<option value="'+k+'"'+(k===st.base?' selected':'')+'>'+x.flag+' '+x.name+(x.real?'':' *')+'</option>';}).join('')+'</select>';
    var seg='<div class="seg" id="tgtSeg"><button data-tv="0" class="'+(st.target===0?'on':'')+'">'+t('breakEven')+'</button>'+
      [0.05,0.085,0.10].map(function(x){return '<button data-tv="'+x+'" class="'+(st.target===x?'on':'')+'">'+pct(x*100,x===0.085?1:0)+'</button>';}).join('')+
      '<button data-tv="custom" class="'+(st.target==='custom'?'on':'')+'">'+t('custom')+'</button></div>'+
      (st.target==='custom'?'<input type="number" id="customIn" value="'+st.customT+'" step="0.5" style="margin-left:8px;width:80px"> %':'');
    var rows='';
    function rr(lab,av,ar,tv,tr,cls){ return '<tr class="'+(cls||'')+'"><td class="lab">'+lab+'</td><td class="num">'+rpShort(av)+'</td><td class="num txt-muted">'+(ar==null?'—':pct(ar))+'</td><td class="num col-tobe">'+(tv==null?'—':rpShort(tv))+'</td><td class="num col-tobe txt-muted">'+(tr==null?'—':pct(tr))+'</td></tr>'; }
    var dec=null, gap=null;
    if(r.feasible){
      gap=(r.ns/b.nsar-1)*100;
      rows=rr(t('iN'),b.nsar,100,r.ns,100,'move')+rr(t('iC'),b.cogs,b.cogs/b.nsar*100,r.cogm,rc*100,'move')+
        rr(t('iG'),b.nsar-b.cogs,(b.nsar-b.cogs)/b.nsar*100,r.gp1,r.gp1/r.ns*100,'gp')+
        rr(t('iS1'),b.sm1,b.sm1/b.nsar*100,b.sm1,b.sm1/r.ns*100)+rr(t('iS2'),b.sm2,b.sm2/b.nsar*100,b.sm2,b.sm2/r.ns*100)+
        rr(t('iS3'),b.sm3,b.sm3/b.nsar*100,b.sm3,b.sm3/r.ns*100)+rr(t('iS4'),b.sm4,b.sm4/b.nsar*100,b.sm4,b.sm4/r.ns*100)+
        rr(t('iE'),asis,asis/b.nsar*100,r.ebt,target*100,'ebt');
      // decision: reachable sales climb?
      dec = gap<=25?'go':gap<=80?'pilot':'rework';
    } else dec='hold';
    var decMap={go:'b-go',pilot:'b-pilot',rework:'b-rework',hold:'b-hold'};
    var tiles='<div class="tiles" style="margin-top:14px">'+
      (r.feasible?tile(t('salesGap'),pctS(gap),gap<=25?'good':gap<=80?'warn':'bad',rpShort(r.ns-b.nsar)):tile(t('salesGap'),'∞','bad',''))+
      (r.feasible?tile(t('ebtTobe'),rpShort(r.ebt),'hi',pct(target*100,1)):'')+
      tile(t('cogmR'),pct(rc*100),rc<=0.75?'good':rc>=0.82?'bad':'warn',c.name)+
      tile(t('decision'),'<span class="badge '+decMap[dec]+'">'+t('dec'+dec.charAt(0).toUpperCase()+dec.slice(1))+'</span>',dec==='go'?'good':dec==='hold'?'bad':'warn','')+'</div>';
    var read = r.feasible?'<p class="note">'+t('p3read',{name:c.name,ns:rpShort(r.ns),g:pctS(gap),t:pct(target*100,1)})+'</p>':'';
    var body='<div class="card-body"><div class="selbar">'+
        '<div class="fld"><label>'+t('baseline')+'</label>'+baseSel+'</div><div class="fld"><label>'+t('nplCogm')+'</label>'+nplPicker()+'</div>'+
        '<div class="fld"><label>'+t('target')+'</label>'+seg+'</div></div>'+tiles+
      '<div class="table-wrap" style="margin-top:14px"><table class="aistobe"><thead><tr><th>'+t('item')+'</th><th>'+t('asis')+'</th><th>'+t('ratio')+'</th><th class="col-tobe">'+t('tobe')+'</th><th class="col-tobe">'+t('ratio')+'</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+read+srcbar('rev')+'</div>';
    return pagehead(t('p3t'),t('p3l'))+card('🧮',t('n3'),b.name+' · '+c.name,null,body);
  }

    var btab='<div class="table-wrap"><table class="dt"><thead><tr><th>'+t('brandH')+'</th><th class="num">'+t('valH')+'</th><th class="num">'+t('shareH')+'</th><th class="num">'+t('chgH')+'</th></tr></thead><tbody>'+brows+'</tbody></table></div>';

    var right='<div style="min-width:0">'+tiles+
      '<h4 style="font-size:12.5px;margin:16px 0 8px">'+t('flavorH')+'</h4>'+ftab+

  /* ========== PAGE 5 — Launch Ranking ========== */
  function page5(){
    var evals=COMBOS.map(evalCombo).map(function(e,i){ e.idx=i; return e; }).sort(function(a,b){return b.opp-a.opp;});
    var decMap={go:'b-go',pilot:'b-pilot',rework:'b-rework',hold:'b-hold'};
    var trs=evals.map(function(e,i){ var c=e.c, fl=e.fl;
      var dem=fl?(fl.chg>=10?'<span class="delta-up">▲'+pctS(fl.chg)+'</span>':fl.chg<0?'<span class="delta-dn">▼'+pctS(fl.chg)+'</span>':pctS(fl.chg)):'<span class="txt-muted">white space</span>';
      return '<tr class="click'+(e.idx===st.selCombo?' sel':'')+'" data-i="'+e.idx+'"><td class="num">'+(i+1)+'</td><td>'+c.emoji+' '+c.name+'</td>'+
        '<td>'+e.cm.country+' · '+e.cm.channel+' · '+e.cm.sub+'</td><td class="num '+(e.gp>=22?'txt-green':e.gp<16?'txt-red':'txt-amber')+'">'+pct(e.gp)+'</td>'+

    return pagehead(t('p5t'),t('p5l'))+card('🏁',t('n5'),null,null,body1)+card('🗂️',t('sliceT'),null,null,sliceTab);

  function comboDetail(e){
    var decMap={go:'b-go',pilot:'b-pilot',rework:'b-rework',hold:'b-hold'};
    var risk=e.risk==='Low'?'txt-green':e.risk==='Medium'?'txt-amber':'txt-red';
    var conf=e.conf==='High'?'txt-green':e.conf==='Medium'?'txt-amber':'txt-red';
    function sb(lab,val,max){ return '<div class="sb"><span class="sbl">'+lab+'</span><div class="sbt"><i style="width:'+(val/max*100)+'%"></i></div><span class="sbv">'+Math.round(val)+'/'+max+'</span></div>'; }
    var gates=[['gMkt',e.gates.gMkt],['gEbt',e.gates.gEbt],['gEvid',e.gates.gEvid],['gCap',e.gates.gCap]];
    var rationale=gates.map(function(g){ return '<div class="ri"><span class="'+(g[1]?'ok':'no')+'">'+(g[1]?'✓':'✕')+'</span>'+t(g[0])+'</div>'; }).join('');
    return '<div class="detail"><div class="detail-head"><span class="de">'+e.c.emoji+'</span><div><h4>'+e.c.name+' — '+e.cm.country+' '+e.cm.channel+' ('+e.cm.sub+')</h4><div class="dsub">'+(e.fl?L(e.fl.n)+' '+pctS(e.fl.chg):'white space')+'</div></div><div class="dcall"><span class="badge '+decMap[e.decision]+'" style="font-size:12px;padding:4px 12px">'+t('dec'+e.decision.charAt(0).toUpperCase()+e.decision.slice(1))+'</span></div></div>'+
      '<div class="detail-body"><div class="kpi4">'+
        '<div class="kpi"><div class="kv">'+e.opp+'<span style="font-size:11px;color:var(--muted)">/100</span></div><div class="kl">'+t('oppScore')+'</div></div>'+
        '<div class="kpi"><div class="kv">'+e.prob+'%</div><div class="kl">'+t('probSucc')+'</div></div>'+
        '<div class="kpi"><div class="kv '+risk+'">'+t('risk'+e.risk)+'</div><div class="kl">'+t('riskL')+'</div></div>'+
        '<div class="kpi"><div class="kv '+conf+'">'+t('conf'+e.conf)+'</div><div class="kl">'+t('confL')+'</div></div>'+
      '</div>'+
      '<div class="grid2" style="margin-top:14px"><div><h4 style="font-size:12px;margin-bottom:8px">'+t('scoreBreak')+'</h4><div class="scorebars">'+
        sb(t('sbDemand'),e.demand,40)+sb(t('sbMargin'),e.margin,30)+sb(t('sbChannel'),e.channel,30)+
        '</div><div class="tile" style="margin-top:10px"><div class="tl">'+t('expEbt')+'</div><div class="tv '+(e.ebt>=0?'txt-green':'txt-red')+'">'+pct(e.ebt)+'</div><div class="tsub">GP '+pct(e.gp)+' − SM/A&P '+pct(smTotal(e.cm.channel))+'</div></div></div>'+
        '<div><h4 style="font-size:12px;margin-bottom:8px">'+t('rationale')+'</h4><div class="reasons">'+rationale+'</div>'+
        '<div class="tile warn" style="margin-top:10px"><div class="tl">'+t('caution')+'</div><div style="font-size:12px;color:var(--ink-2);margin-top:4px">'+t('cautionTxt')+'</div></div></div></div>'+
      '</div></div>';
  }

  /* ========== PAGE 6 — Data & Upload ========== */
  function page6(){
    var e=ENG();
    var cur='<div class="table-wrap"><table class="dt"><thead><tr><th>SKU</th><th class="num">RM</th><th class="num">PM</th><th class="num">COGM full</th><th class="num">GP full</th></tr></thead><tbody>'+
      DATA.npls.map(function(c){return '<tr><td>'+c.emoji+' '+c.name+'</td><td class="num">'+rpFull(c.cogm.rm)+'</td><td class="num">'+rpFull(c.cogm.pm)+'</td><td class="num">'+rpFull(cogmFull(c))+'</td><td class="num">'+pct(gpFull(c))+'</td></tr>';}).join('')+
      '<tr class="grp"><td>'+(lang==='id'?'Kapasitas / DBP':'Capacity / DBP')+'</td><td class="num" colspan="4" style="text-align:right">'+grp(e.fullCap)+' ctn · DBP '+rpFull(e.dbp)+'</td></tr></tbody></table></div>';
    var body='<div class="card-body">'+
      '<div class="drop" id="drop"><div style="font-size:26px">⬆</div><div style="font-weight:700;margin-top:6px;color:var(--ink)">'+t('upCogm')+'</div><div class="note" style="margin-top:4px">'+t('upHint')+'</div><input type="file" id="fileIn" accept=".xlsx,.xls" class="hidden"></div>'+
      '<div id="upMsg" class="note"></div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn ghost" id="expBtn">⬇ '+t('expJson')+'</button><button class="btn ghost" id="impBtn">⬆ '+t('impJson')+'</button><input type="file" id="jsonIn" accept=".json" class="hidden"><button class="btn ghost" id="resetBtn">↺ '+t('resetD')+'</button></div>'+
      '<h4 style="font-size:12.5px;margin:18px 0 8px">'+t('curData')+'</h4>'+cur+'</div>';
    return pagehead(t('pDatat'),t('pDatal'))+card('⚙️',t('nData'),null,null,body);
  }

  /* ========== shared ========== */
  function srcbar(which){
    var m={cogm:lang==='id'?'COGM dari workbook SIIP (Depre & OMC tetap/bulan → membengkak saat utilisasi turun). Edit angka langsung; tersimpan di browser. Upload workbook di tab Data.':'COGM from the SIIP workbook (Depre & OMC fixed/month → balloon as utilisation falls). Edit numbers directly; stored in this browser. Upload a workbook in the Data tab.',
      rev:lang==='id'?'Indonesia = P&L existing (nyata). Malaysia & China (*) = asumsi 2025. Rasio COGM to-be dari tab COGM (kapasitas penuh).':'Indonesia = existing P&L (real). Malaysia & China (*) = 2025 assumptions. To-be COGM ratio from the COGM tab (full capacity).',
      rank:lang==='id'?'Opportunity = demand Nielsen (40) + margin COGM (30) + fit channel (30). Keputusan ikut gate: kapasitas pasar, EBT di skala, bukti demand, kapabilitas eksekusi.':'Opportunity = Nielsen demand (40) + COGM margin (30) + channel fit (30). Decision follows gates: market capacity, EBT at scale, demand evidence, execution capability.'};
    return '<div class="srcbar"><span>📎</span><span>'+m[which]+'</span></div>';
  }

  /* ========== globe ========== */
  function globeFallback(el){
    // static SVG globe with the three launch markers, used when globe.gl can't load (offline)
    var pts={id:[205,150],my:[180,120],cn:[210,70]};
    el.innerHTML='<svg viewBox="0 0 380 300" style="width:100%;height:100%">'+
      '<defs><radialGradient id="gg" cx="38%" cy="32%" r="75%"><stop offset="0%" stop-color="#2b5e9e"/><stop offset="60%" stop-color="#143a66"/><stop offset="100%" stop-color="#0a1f38"/></radialGradient></defs>'+
      '<circle cx="190" cy="150" r="120" fill="url(#gg)" stroke="#6aa0e0" stroke-opacity=".4"/>'+
      [40,80,120,160,200].map(function(y){return '<ellipse cx="190" cy="150" rx="120" ry="'+Math.max(8,120-Math.abs(150-(30+y)))+'" fill="none" stroke="#6aa0e0" stroke-opacity=".12"/>';}).join('')+
      [95,135,190,245,285].map(function(x){return '<line x1="'+x+'" y1="40" x2="'+x+'" y2="260" stroke="#6aa0e0" stroke-opacity=".1"/>';}).join('')+
      COUNTRIES.map(function(c){var p=pts[c.k]; return '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="5" fill="#E0A94A"/><text x="'+(p[0]+9)+'" y="'+(p[1]+4)+'" font-size="11" fill="#cfe0f5">'+c.flag+' '+c.name+'</text>';}).join('')+
      '</svg>';
  }
  function initGlobe(){
    var el=document.getElementById('globeBox'); if(!el) return;
    if(typeof window.Globe==='undefined'){ globeFallback(el); return; }
    try{
      var g=window.Globe()(el)
        .globeImageUrl('https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-blue-marble.jpg')
        .bumpImageUrl('https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-topology.png')
        .backgroundColor('rgba(0,0,0,0)').showAtmosphere(true).atmosphereColor('#6aa0e0').atmosphereAltitude(0.2)
        .width(el.clientWidth).height(el.clientHeight)
        .htmlElementsData(COUNTRIES).htmlLat(function(d){return d.lat;}).htmlLng(function(d){return d.lng;})
        .htmlElement(function(d){ var s=document.createElement('div'); s.innerHTML='<div style="font-size:18px;text-align:center;transform:translate(-50%,-100%)"><div>📍</div><div style="font-size:10px;color:#fff;background:rgba(10,22,40,.8);border-radius:6px;padding:1px 6px;white-space:nowrap">'+d.flag+' '+d.name+'</div></div>'; s.style.pointerEvents='none'; return s; });
      g.pointOfView({lat:6,lng:112,altitude:2.2},0);
      try{ var ctr=g.controls(); ctr.autoRotate=true; ctr.autoRotateSpeed=0.18; ctr.enableZoom=false; }catch(e){}
      globe=g;
    }catch(e){ globeFallback(el); }
  }

  /* ========== render + wire ========== */
  function render(){
    document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent=t(el.getAttribute('data-i18n')); });
    document.documentElement.setAttribute('lang',lang);
    renderNav();
    globe=null;
    document.getElementById('view').innerHTML=[page1,page2,page3,page4,page5,page6][st.page-1]();
    wire();
    if(st.page===4) setTimeout(initGlobe,30);
  }
  function wire(){
    document.querySelectorAll('.npl[data-k]').forEach(function(el){ el.addEventListener('click',function(){ st.sel=el.getAttribute('data-k'); if(st.page===2)st.vol=ENG().fullCap; render(); }); });
    var add=document.getElementById('addSlot'); if(add) add.addEventListener('click',function(){ st.addOpen=true; render(); });
    var aAdd=document.getElementById('aAdd'); if(aAdd) aAdd.addEventListener('click',function(){
      var name=(document.getElementById('aName').value||'New NPL').trim(), rm=+document.getElementById('aRm').value||26000, cat=document.getElementById('aCat').value;
      var base=npl('nori').cogm; DATA.npls.push({k:'npl'+Date.now(), name:name, sku:'3.5g', emoji:'🆕', nielsen:cat, cogm:{depreF:base.depreF,omcF:base.omcF,dl:base.dl,listrik:base.listrik,gas:base.gas,rm:rm,pm:base.pm}});
      st.addOpen=false; saveData(); render(); });
    var aCancel=document.getElementById('aCancel'); if(aCancel) aCancel.addEventListener('click',function(){ st.addOpen=false; render(); });
    var sel=document.getElementById('nplSel'); if(sel) sel.addEventListener('change',function(){ st.sel=sel.value; if(st.page===2)st.vol=ENG().fullCap; render(); });
    // COGM
    var vr=document.getElementById('volR'); if(vr) vr.addEventListener('input',function(){ st.vol=+vr.value; var c=npl(st.sel);
      var a=document.getElementById('volLbl'); if(a)a.textContent=grp(st.vol)+' '+t('ctn');
      var m=document.getElementById('capM'); if(m)m.innerHTML=capFill(st.vol);
      var ti=document.getElementById('cogmTiles'); if(ti)ti.innerHTML=cogmTiles(c);
      var cv=document.getElementById('cogmCurve'); if(cv)cv.innerHTML=cogmCurve(c); });
    var fc=document.getElementById('fcIn'); if(fc) fc.addEventListener('change',function(){ var v=+fc.value||ENG().fullCap; ENG().fullCap=v; st.vol=Math.min(st.vol,v); saveData(); render(); });
    var dbp=document.getElementById('dbpIn'); if(dbp) dbp.addEventListener('change',function(){ ENG().dbp=+dbp.value||ENG().dbp; saveData(); render(); });
    var setFull=document.getElementById('setFullBtn'); if(setFull) setFull.addEventListener('click',function(){ st.vol=ENG().fullCap; render(); });
    document.querySelectorAll('#cogmInputs input[data-f]').forEach(function(inp){ inp.addEventListener('change',function(){ var c=npl(st.sel); c.cogm[inp.getAttribute('data-f')]=+inp.value||0; saveData(); render(); }); });
    // reverse
    var bs=document.getElementById('baseSel'); if(bs) bs.addEventListener('change',function(){ st.base=bs.value; render(); });
    var tg=document.getElementById('tgtSeg'); if(tg) tg.querySelectorAll('button').forEach(function(b){ b.addEventListener('click',function(){ var v=b.getAttribute('data-tv'); st.target=v==='custom'?'custom':parseFloat(v); render(); }); });
    var ci=document.getElementById('customIn'); if(ci) ci.addEventListener('change',function(){ st.customT=+ci.value||10; render(); });
    // market combos
    document.querySelectorAll('.cmb[data-k]').forEach(function(el){ el.addEventListener('click',function(){ st.sel=el.getAttribute('data-k'); st.page=1; render(); }); });
    // ranking
    var rt=document.getElementById('rankT'); if(rt) rt.querySelectorAll('tbody tr').forEach(function(tr){ tr.addEventListener('click',function(){ st.selCombo=+tr.getAttribute('data-i'); render(); }); });
    // data tab
    wireData();
  }
  function wireData(){
    var drop=document.getElementById('drop'), fileIn=document.getElementById('fileIn');
    if(drop&&fileIn){ drop.addEventListener('click',function(){ fileIn.click(); });
      ['dragover','dragenter'].forEach(function(ev){ drop.addEventListener(ev,function(e){ e.preventDefault(); drop.classList.add('hot'); }); });
      ['dragleave','drop'].forEach(function(ev){ drop.addEventListener(ev,function(e){ e.preventDefault(); drop.classList.remove('hot'); }); });
      drop.addEventListener('drop',function(e){ if(e.dataTransfer.files[0]) readXlsx(e.dataTransfer.files[0]); });
      fileIn.addEventListener('change',function(){ if(fileIn.files[0]) readXlsx(fileIn.files[0]); }); }
    var exp=document.getElementById('expBtn'); if(exp) exp.addEventListener('click',function(){ var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'})); a.download='npl-atomic-data.json'; a.click(); });
    var imp=document.getElementById('impBtn'), jsonIn=document.getElementById('jsonIn');
    if(imp&&jsonIn){ imp.addEventListener('click',function(){ jsonIn.click(); }); jsonIn.addEventListener('change',function(){ var f=jsonIn.files[0]; if(!f)return; var rd=new FileReader(); rd.onload=function(){ try{ DATA=JSON.parse(rd.result); saveData(); render(); }catch(e){} }; rd.readAsText(f); }); }
    var rs=document.getElementById('resetBtn'); if(rs) rs.addEventListener('click',function(){ resetData(); st.vol=ENG().fullCap; render(); });
  }
  function readXlsx(file){
    var msg=document.getElementById('upMsg');
    if(typeof XLSX==='undefined'){ if(msg){msg.textContent=t('upErr'); msg.className='note txt-red';} return; }
    var rd=new FileReader();
    rd.onload=function(){ try{
      var wb=XLSX.read(new Uint8Array(rd.result),{type:'array'}); var ws=wb.Sheets['Sheet1']||wb.Sheets[wb.SheetNames[0]];
      function cell(a){ var c=ws[a]; return c?+c.v:null; }
      var fullCap=cell('O4')||ENG().fullCap, dbp=cell('L4')||ENG().dbp;
      ENG().fullCap=fullCap; ENG().dbp=dbp;
      var rowMap={13:'nori',14:'karaage',15:'kari'}, n=0;
      Object.keys(rowMap).forEach(function(r){ var c=npl(rowMap[r]); if(!c) return;
        var depre=cell('D'+r), omc=cell('E'+r), dl=cell('F'+r), li=cell('G'+r), ga=cell('H'+r), rm=cell('I'+r), pm=cell('J'+r);
        if(rm!=null){ c.cogm={depreF:depre,omcF:omc,dl:dl,listrik:li,gas:ga,rm:rm,pm:pm}; n++; } });
      saveData(); st.vol=ENG().fullCap;
      if(msg){ msg.textContent=t('upOk',{n:n}); msg.className='note txt-green'; }
      render();
    }catch(e){ if(msg){msg.textContent=t('upErr'); msg.className='note txt-red';} } };
    rd.readAsArrayBuffer(file);
  }

  /* ========== theme + lang ========== */
  function applyTheme(mode){ var r=document.documentElement; if(mode==='light')r.setAttribute('data-theme','light'); else if(mode==='dark')r.setAttribute('data-theme','dark'); else r.removeAttribute('data-theme');
    var lbl=document.getElementById('themeLabel'); if(lbl)lbl.textContent=mode==='light'?(lang==='id'?'Terang':'Light'):mode==='dark'?(lang==='id'?'Gelap':'Dark'):(lang==='id'?'Sistem':'System'); try{localStorage.setItem('npla-theme',mode);}catch(e){} }
  (function(){ var s='system'; try{s=localStorage.getItem('npla-theme')||'system';}catch(e){} applyTheme(s);
    document.getElementById('themeBtn').addEventListener('click',function(){ var c='system'; try{c=localStorage.getItem('npla-theme')||'system';}catch(e){} applyTheme(c==='system'?'light':c==='light'?'dark':'system'); if(globe)render(); }); })();
  document.getElementById('langBtn').addEventListener('click',function(){ lang=lang==='en'?'id':'en'; lset('npla-lang',lang); document.getElementById('langLabel').textContent=lang==='id'?'ID':'EN'; render(); });
  document.getElementById('langLabel').textContent=lang==='id'?'ID':'EN';

  render();
})();
</script>
